name: destravar
on: workflow_dispatch
permissions:
  actions: write
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          for id in $(gh api "repos/$REPO/actions/runs?per_page=30" --jq '.workflow_runs[] | select(.status != "completed") | .id'); do
            [ "$id" = "$RUN" ] && continue
            st=$(gh api "repos/$REPO/actions/runs/$id" --jq '.status + " attempt=" + (.run_attempt|tostring) + " " + .name')
            r1=$(gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" 2>&1 | head -c 200)
            r2=$(gh api -X POST "repos/$REPO/actions/runs/$id/cancel" 2>&1 | head -c 200)
            echo "::warning::$id [$st] force=[$r1] cancel=[$r2]"
          done
