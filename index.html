:root{--y:#FFF952;--n:#173a78;--nd:#0f2a5c;--n2:#3d5c94;--bg:#edf2fb;--cr:#FFFCB8;--ln:#dfe7f4;--tx:#10244a;--mu:#6a7b98;--rd:#c0322a;--gn:#16895a;--or:#c46a1a;--ac:#1f66f0;--ac2:#4f8dff;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
--display:'Plus Jakarta Sans','DM Sans','Segoe UI',Arial,sans-serif;--body:'Plus Jakarta Sans','DM Sans','Segoe UI',Arial,sans-serif;--e:cubic-bezier(.2,.8,.2,1);color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--body);min-width:1100px}
body.pub{min-width:0;overflow:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--n);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15}
.mk{display:inline-block;background:var(--n);-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat;aspect-ratio:1.0065}
.fl{display:inline-block;background:var(--n);-webkit-mask:var(--fl) center/contain no-repeat;mask:var(--fl) center/contain no-repeat;aspect-ratio:5.0056}
.ow{display:inline-block;background:var(--n);-webkit-mask:var(--ow) center/contain no-repeat;mask:var(--ow) center/contain no-repeat;aspect-ratio:257/400}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--n);background:var(--n);color:var(--y);padding:8px 16px;border-radius:10px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--nd)}
.btn:active{transform:none;box-shadow:none}
.btn.o{background:transparent;color:var(--n)}.btn.o:hover{background:var(--k-ffffff)}
.btn.y{background:var(--y);color:var(--n);border-color:var(--y)}
.btn.d{background:transparent;color:var(--rd);border-color:var(--rd)}
.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg,.ib svg{width:18px;height:18px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{border:1px solid var(--ln);background:var(--k-ffffff);border-radius:9px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--n)}
.ib:hover{background:var(--n);color:var(--y)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lv{background:var(--y);display:grid;place-items:center;padding:40px;position:relative;overflow:hidden}
.lv::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(36,70,105,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(36,70,105,.09) 1px,transparent 1px);background-size:44px 44px}
.lv .in{position:relative;text-align:left;max-width:420px}
.lv .fl{width:min(100%,380px);display:block}
.lv p{font:500 1.15rem/1.5 var(--body);margin:22px 0 0;color:var(--n)}
.lr{background:var(--nd);color:var(--y);display:grid;place-items:center;padding:40px}
.lc{width:min(100%,360px);animation:up .7s var(--e) both}
.lc h1{font:800 2rem var(--display);margin:0 0 6px}
.lc p{margin:0 0 24px;opacity:.75}
.lc input{width:100%;background:var(--k-fffeeb);color:var(--n);border:2px solid transparent;border-radius:12px;padding:13px 15px;font-size:1rem;margin-bottom:10px}
.lc input:focus{outline:0;border-color:var(--y)}
.lc .btn{width:100%;justify-content:center;margin-top:6px;background:var(--y);color:var(--n);border-color:var(--y);padding:13px}
.lc .fg{background:none;border:0;color:var(--y);opacity:.8;margin-top:14px;text-decoration:underline;padding:0}
.er{min-height:1.4em;margin-top:10px;font-weight:700;color:#ffb4b4}
/* shell */
#app{display:block}
.sb{position:fixed;left:0;top:0;bottom:0;width:68px;z-index:40;background:var(--nd);color:var(--y);overflow:hidden;padding:16px 12px;display:flex;flex-direction:column;transition:width .28s var(--e),box-shadow .28s}
.sb:hover,.sb:has(:focus-visible){width:250px;box-shadow:10px 0 34px rgba(22,48,74,.35)}
.tx{white-space:nowrap;opacity:0;transition:opacity .15s}
.sb:hover .tx,.sb:has(:focus-visible) .tx{opacity:1;transition-delay:.1s}
.sb .br{display:flex;align-items:center;gap:12px;padding:2px 0 14px;height:48px;text-decoration:none}
.sb .br .mk{width:38px;background:#0f2a5c;flex:none}
.sb .br .fl{height:22px;background:var(--y)}
#nav{overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.ng{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;padding:14px 10px 4px;height:30px;white-space:nowrap;overflow:hidden}
.ng.tx{opacity:0}.sb:hover .ng.tx{opacity:.5}
#nav a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;padding:9px 10px;border-radius:10px;font-weight:700;white-space:nowrap;position:relative;transition:background .2s}
#nav a:hover{background:rgba(255,249,82,.1)}
#nav a.on{background:var(--y);color:var(--n)}
#nav a svg{width:20px;height:20px}
#nav a .bd{position:absolute;left:28px;top:5px;min-width:16px;height:16px;border-radius:8px;background:#ff6b6b;color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
#nav a.sub{padding-left:10px}
.sbf{border-top:1px solid rgba(255,249,82,.18);padding-top:10px;margin-top:6px}
.usr{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:inherit;padding:3px;border-radius:12px;text-align:left;white-space:nowrap;text-decoration:none}

/* cards */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.k{background:var(--k-ffffff);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;animation:up .5s var(--e) both}

.pn{background:var(--k-ffffff);border:1px solid var(--ln);border-radius:16px;padding:18px 20px;animation:up .5s var(--e) both;min-width:0}

.gr{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}

.st.on{background:var(--k-e3f4ea);color:var(--gn)}.st.of{background:var(--k-fde3e1);color:var(--rd)}.st.wn{background:var(--k-fff0d6);color:var(--kt-8a5a00)}.st.nu{background:var(--k-e9ecf1);color:var(--n2)}
/* hero */
.hero{background:var(--n);color:var(--y);border-radius:20px;padding:26px 30px;position:relative;overflow:hidden;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:20px;animation:up .5s var(--e) both}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,249,82,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,249,82,.07) 1px,transparent 1px);background-size:38px 38px}
.hero>*{position:relative}.hero h1{font:800 2rem var(--display)}.hero p{margin:4px 0 0;opacity:.8}
.hero .mk{width:84px;background:#0f2a5c}
/* lists */
.ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ul li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}

.dt.late{background:var(--k-fde3e1)}.dt.late b{color:var(--rd)}
table.tb{width:100%;border-collapse:collapse;background:var(--k-ffffff);border:1px solid var(--ln);border-radius:14px;overflow:hidden}

.tb td{padding:10px 14px;border-top:1px solid var(--k-edf1f9);vertical-align:middle}

.tb .ac{text-align:right;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--k-e3eaf7);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}

.tabs button.on{background:var(--n);color:var(--y)}
/* kanban */

.col>header{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}

.col>header .add{margin-left:auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--n);background:none;font-weight:800;line-height:1;color:var(--n);flex:none}

.cd{background:var(--k-ffffff);border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(22,48,74,.12);cursor:pointer;border-left:4px solid var(--c,var(--n));transition:transform .2s var(--e),box-shadow .2s;animation:up .4s var(--e) both}

.na .cd{animation:none}
.cd:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,48,74,.16)}.cd.dg{opacity:.4}
.cd .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cd h4{font:700 .93rem/1.3 var(--body);letter-spacing:0;margin:0}.cd p{margin:2px 0 0;color:var(--mu);font-size:.82rem}
.cd .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cd .mt span{background:var(--bg);border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700}

.cd .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cd .ajc{margin:6px 0 0;padding:6px 8px;background:var(--k-fde3e1);color:var(--rd);border-radius:8px;font-size:.76rem;font-weight:600}
.cd .th{height:92px;border-radius:8px;background:var(--k-e3eaf7) center/cover;margin:-2px 0 8px;display:grid;place-items:center;color:var(--mu)}
.wa{color:var(--n);font-weight:700;text-decoration:none;border-bottom:2px solid var(--y)}.wa:hover{background:var(--y)}
.gcol{flex:0 0 180px;padding-top:2px}
.addst{width:100%;border:2px dashed var(--ln);background:none;border-radius:14px;padding:14px 10px;font-weight:700;color:var(--n)}.addst:hover{background:var(--k-ffffff);border-color:var(--n)}
/* modal */
.md{position:fixed;inset:0;background:rgba(22,48,74,.55);display:grid;place-items:center;padding:16px;z-index:70;animation:pop .2s both}
.md>form,.md>.bx{background:var(--k-ffffff);border-radius:18px;padding:24px 26px;width:min(100%,640px);max-height:92vh;overflow:auto;display:grid;gap:14px;animation:up .3s var(--e) both;align-content:start}
.md.w>form,.md.w>.bx{width:min(100%,900px)}
.md h3{font:800 1.25rem var(--display)}
.md .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg2 .w{grid-column:1/-1}.fg2 .t3{grid-column:span 1}
.md label,.fld{display:grid;gap:5px;font-weight:700;font-size:.8rem;align-content:start}
.md input,.md select,.md textarea,.fld input,.fld select,.fld textarea{border:2px solid var(--ln);border-radius:10px;padding:9px 12px;background:var(--k-ffffff);width:100%}
.md input:focus,.md select:focus,.md textarea:focus{outline:0;border-color:var(--n)}
.md textarea{min-height:76px;resize:vertical}
.md input[type=checkbox]{width:auto}
.hint{color:var(--mu);font-size:.8rem;font-weight:400;margin:0}
.act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.act .d{margin-right:auto}
.err{border-color:var(--rd)!important}
.fi{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:10px;margin-top:6px}
.fi .ft{width:44px;height:44px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.66rem}
.fi b{font-size:.84rem;word-break:break-all;display:block}.fi small{color:var(--mu)}.fi a{font-weight:700;color:var(--n);font-size:.8rem}
.fi button{border:0;background:none;font-size:1.3rem;color:var(--mu)}
.fup{display:flex;border:2px dashed var(--ln);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--n);font-weight:700;justify-content:center;margin-top:6px}.fup:hover{background:var(--bg)}
.tl{display:grid;gap:0}.tl .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--k-edf1f9);font-size:.85rem}.tl .it small{color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:var(--k-ffffff);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;color:var(--n)}.chips button.on{background:var(--n);color:var(--y);border-color:var(--n)}
.bar{height:8px;border-radius:4px;background:var(--k-e3eaf7);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--n);transition:width .8s var(--e)}
.sec{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:6px 0 -4px}
/* charts */
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{font:500 11px var(--body);fill:var(--mu)}
.ch .ax{stroke:var(--k-c3cde0)}.ch .gl{stroke:var(--k-e4eaf5)}
.ch .hit:hover{fill:rgba(36,70,105,.06)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:95;background:var(--k-ffffff);border:1px solid var(--ln);box-shadow:0 8px 22px rgba(22,48,74,.18);border-radius:10px;padding:7px 11px;font-size:.78rem;pointer-events:none;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}#tip b{display:block}
.ring text.v{font:800 22px var(--display);fill:var(--tx)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.cal .h{background:var(--k-f5f8fd);padding:8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:700;text-align:center}
.cal .dy{background:var(--k-ffffff);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .dy.o{background:var(--k-f8fafe)}.cal .dy .n{font-size:.78rem;font-weight:700;color:var(--mu)}.cal .dy.td .n{background:var(--n);color:var(--y);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal .ev{display:flex;gap:6px;align-items:center;font-size:.72rem;font-weight:700;border-radius:7px;padding:3px 6px;cursor:pointer;background:var(--bg);border-left:3px solid var(--c,var(--n));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .ev:hover{filter:brightness(.95)}.cal .ev svg{width:12px;height:12px;flex:none}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 110px);background:var(--k-ffffff);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.chl{border-right:1px solid var(--ln);overflow:auto;padding:10px;background:var(--k-f5f8fd)}
.chl h5{margin:10px 8px 4px;font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.chl button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;text-align:left;font-weight:700;color:var(--n)}
.chl button:hover{background:var(--k-e5ecf8)}.chl button.on{background:var(--n);color:var(--y)}.chl .u{margin-left:auto;background:#ff6b6b;color:#fff;font-size:.68rem;border-radius:9px;padding:0 6px}
.chm{display:flex;flex-direction:column;min-width:0}
.chm .tt{padding:12px 18px;border-bottom:1px solid var(--ln);font:800 1.05rem var(--display)}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;background:var(--k-fafcff)}
.mg{display:flex;gap:10px;margin-top:10px;max-width:78%}.mg.me{align-self:flex-end;flex-direction:row-reverse}
.mg .bb{background:var(--k-ffffff);border:1px solid var(--ln);border-radius:14px;padding:7px 12px;white-space:pre-wrap;word-break:break-word}
.mg.me .bb{background:var(--n);color:var(--y);border-color:var(--n)}
.mg .nm{font-size:.74rem;font-weight:700;color:var(--mu);margin-bottom:2px}.mg.me .nm{text-align:right}
.mg small{color:var(--mu);font-size:.68rem;display:block;margin-top:2px}.mg.me small{text-align:right}
.mg .mdl{position:absolute;top:50%;transform:translateY(-50%);right:-30px;width:24px;height:24px;border-radius:50%;border:1px solid var(--ln);background:var(--k-ffffff);color:var(--rd);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:.45;transition:opacity .15s,background .15s}.mg .mdl svg.i{width:13px;height:13px}.mg:hover .mdl,.mg .mdl:focus-visible{opacity:1}.mg.me .mdl{right:auto;left:-30px}.mg .mdl:hover{background:var(--rd);color:#fff;border-color:var(--rd)}
.mg.cli .bb{background:var(--k-fff7d6);border-color:#ecd87a;color:var(--tx)}
.dv{align-self:center;font-size:.72rem;color:var(--mu);margin:12px 0 2px;font-weight:700}
.cmp{display:flex;gap:10px;padding:12px;border-top:1px solid var(--ln)}
.cmp textarea{flex:1;border:2px solid var(--ln);border-radius:12px;padding:9px 12px;resize:none;height:42px}.cmp textarea:focus{outline:0;border-color:var(--n)}
/* approvals */
.apg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sw{width:100%;max-width:100%}
@media print{body{min-width:0;background:var(--k-ffffff)}}

/* ---- tela de configuração do PDF ---- */
.pdfm{width:min(100%,1060px)}

/* estrutura da tela */
#tv .pv-s{height:100%;display:flex;flex-direction:column;min-height:0}
#tv .pv-h{display:flex;justify-content:space-between;align-items:flex-end;gap:2em;margin-bottom:1.1em;animation:pvup .7s both}
#tv .pv-h small{display:block;font-size:.82em;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--tvy);opacity:.95}
#tv .pv-h h1{margin:.1em 0 0;font:800 2.7em/1.05 var(--display,inherit);letter-spacing:-.02em}
#tv .pv-h p{margin:0;color:rgba(255,255,255,.62);font-size:1.05em;font-weight:600;padding-bottom:.4em}
#tv .pv-g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.1em}
#tv .pv-b{position:relative;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid var(--g2);border-radius:1.3em;padding:1.2em 1.35em;box-shadow:0 1.4em 3em -1.6em rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(1.2em);backdrop-filter:blur(1.2em);animation:pvup .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.07s + .15s);display:flex;flex-direction:column}
#tv .pv-bh{display:flex;align-items:center;gap:.7em;margin-bottom:.8em}
#tv .pv-bh h3{margin:0;font:800 1.08em/1.1 var(--display,inherit);letter-spacing:.01em;flex:1}
#tv .pv-bh em{font-style:normal;font-size:.76em;font-weight:800;color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);padding:.3em .8em;border-radius:99px}
#tv .pv-bi,#tv .pv-ki{width:2.1em;height:2.1em;border-radius:.65em;display:grid;place-items:center;background:rgba(77,141,255,.2);color:#8fb8ff;flex:none}
#tv .pv-bi svg,#tv .pv-ki svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* KPI */
#tv .pv-k{grid-column:span 3;justify-content:center;gap:.15em;padding:1em 1.35em}
#tv .pv-k .pv-ki{position:absolute;right:1em;top:1em}
#tv .pv-k small{font-size:.82em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.62)}
#tv .pv-k>b{font:800 3.4em/1 var(--display,inherit);letter-spacing:-.03em;margin:.05em 0}
#tv .pv-ks{font-size:.86em;font-weight:600;color:rgba(255,255,255,.55)}
#tv .pv-k.gn .pv-ki{background:rgba(68,224,160,.18);color:#44e0a0}#tv .pv-k.gn>b{color:#6ff0bb}
#tv .pv-k.rd .pv-ki{background:rgba(255,123,114,.2);color:#ff938b}#tv .pv-k.rd>b{color:#ff938b}
#tv .pv-k .pv-bar{margin-top:.5em}
/* barras, anéis */
#tv .pv-bar{display:block;height:.55em;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;flex:1;min-width:2em}
#tv .pv-bar i{display:block;height:100%;width:var(--w,0);transform-origin:left center;will-change:transform;border-radius:inherit;background:var(--c,linear-gradient(90deg,#3f7cf0,#8fb8ff));animation:pvbar 1.3s cubic-bezier(.2,.8,.2,1) .45s both}
#tv .pv-hb{display:flex;align-items:center;gap:.9em;padding:.32em 0;font-size:.96em}
#tv .pv-hb>span:first-child{width:42%;font-weight:700;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tv .pv-hb>b{min-width:2.2em;text-align:right;font-weight:800}#tv .pv-hb em{margin-left:.6em;font-style:normal;font-size:.7em;color:#ff938b;font-weight:800}
#tv .pv-rg{position:relative;width:8.6em;height:8.6em;flex:none}
#tv .pv-rg svg{width:100%;height:100%;transform:rotate(-90deg)}
#tv .pv-rg circle{fill:none;stroke-width:9}
#tv .pv-rg .bg{stroke:rgba(255,255,255,.1)}
#tv .pv-rg .fg{stroke:var(--tvy);stroke-linecap:round;stroke-dashoffset:var(--to);animation:pvring 1.6s cubic-bezier(.2,.8,.2,1) .5s both}
#tv .pv-rg.bl .fg{stroke:#6aa4ff}
#tv .pv-rg>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#tv .pv-rg b{font:800 1.9em/1 var(--display,inherit)}#tv .pv-rg small{font-size:.7em;color:rgba(255,255,255,.6);font-weight:700;margin-top:.2em}
#tv .pv-mid,#tv .pv-big{display:flex;align-items:center;gap:1.4em;flex:1}
#tv .pv-mt{display:grid;gap:.15em}#tv .pv-mt b{font:800 2.1em/1.05 var(--display,inherit);letter-spacing:-.02em}#tv .pv-mt small{color:rgba(255,255,255,.6);font-weight:600}#tv .pv-mt span{color:#6ff0bb;font-weight:800;font-size:.9em}
#tv .pv-big{justify-content:center;gap:2em}#tv .pv-big .pv-rg{width:13em;height:13em}#tv .pv-big .pv-rg b{font-size:2.4em}#tv .pv-big .pv-mt b{font-size:2.6em}
/* listas */
#tv .pv-li{display:flex;align-items:center;gap:.8em;padding:.5em .75em;border-radius:.8em;background:rgba(255,255,255,.05);margin-bottom:.45em;border-left:.28em solid var(--c,#4d8dff);animation:pvrow .6s both;animation-delay:.5s}
#tv .pv-li>div{flex:1;min-width:0}#tv .pv-li b{display:block;font-size:.96em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tv .pv-li small{display:block;font-size:.78em;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tv .pv-li>span{font-size:.78em;font-weight:800;color:rgba(255,255,255,.8);white-space:nowrap;background:rgba(255,255,255,.09);padding:.25em .7em;border-radius:99px}
#tv .pv-n{margin:.4em 0 0;font-size:.82em;color:rgba(255,255,255,.5);font-weight:600;text-align:center}
#tv .pv-duo{display:flex;gap:1em;margin-bottom:.7em}
#tv .pv-duo>div{flex:1;background:rgba(255,255,255,.06);border-radius:.9em;padding:.5em .9em}
#tv .pv-duo b{font:800 2em/1 var(--display,inherit);display:block}#tv .pv-duo small{font-size:.76em;color:rgba(255,255,255,.6);font-weight:700}
#tv .pv-duo .rd b{color:#ff938b}
/* vazio / esqueleto */
#tv .pv-em{flex:1;display:grid;place-content:center;justify-items:center;gap:.35em;text-align:center;padding:.6em;color:rgba(255,255,255,.55)}
#tv .pv-em svg{width:2.8em;height:2.8em;fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.4;stroke-dasharray:3 3;margin-bottom:.2em}
#tv .pv-em b{font-size:.98em;color:rgba(255,255,255,.8)}#tv .pv-em small{font-size:.8em;max-width:20em}
#tv .pv-sk{display:flex;align-items:center;gap:.8em;padding:.55em .7em;margin-bottom:.45em;border-radius:.8em;background:rgba(255,255,255,.035)}
#tv .pv-sk i,#tv .pv-sk span{background:linear-gradient(90deg,rgba(255,255,255,.07) 30%,rgba(255,255,255,.17) 50%,rgba(255,255,255,.07) 70%);background-size:200% 100%;animation:pvsh 2.2s linear infinite}
#tv .pv-sk i{width:2.2em;height:2.2em;border-radius:50%}#tv .pv-sk span{height:.7em;border-radius:99px;width:var(--w)}
/* geral */
#tv .s-geral .pv-g{grid-template-rows:auto 1fr 1fr}
#tv .c-meta,#tv .c-pub,#tv .c-rank,#tv .c-rev,#tv .c-mur,#tv .c-prod{grid-column:span 4}
#tv .c-meta .pv-mid{justify-content:center}
/* rank mini */
#tv .pv-rk{display:flex;align-items:center;gap:.8em;padding:.45em .5em;animation:pvrow .6s both;animation-delay:calc(var(--i)*.1s + .5s)}
#tv .pv-rk .pv-pos{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85em;background:rgba(255,255,255,.1)}
#tv .pv-rk.pv-p1 .pv-pos{background:linear-gradient(135deg,#FFF952,#ffc93c);color:var(--kt-0f2a5c)}#tv .pv-rk.pv-p2 .pv-pos{background:linear-gradient(135deg,var(--k-e8eef9),#aab7d1);color:var(--kt-0f2a5c)}#tv .pv-rk.pv-p3 .pv-pos{background:linear-gradient(135deg,var(--k-ffc39a),#d88a55);color:var(--kt-3b1b05)}
#tv .pv-rk .pv-nm{flex:1;min-width:0;display:grid;gap:.15em}#tv .pv-rk .pv-nm b{font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tv .pv-rk .pv-nm small{font-size:.74em;color:rgba(255,255,255,.55)}
#tv .pv-rk .pv-pt{font:800 1.5em/1 var(--display,inherit);color:var(--tvy)}
#tv .pv-mu{border-radius:.9em;padding:.55em .85em;margin-bottom:.45em;background:rgba(255,255,255,.06);border-left:.28em solid var(--c)}
#tv .pv-mu span{font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}#tv .pv-mu b{display:block;font-size:.98em}#tv .pv-mu small{display:block;color:rgba(255,255,255,.6);font-size:.78em;margin-top:.1em}
/* metas */
#tv .s-metas .pv-g{grid-template-rows:1.25fr .8fr}
#tv .s-metas .pv-r1,#tv .s-metas .pv-r2{grid-column:span 4}#tv .s-metas .pv-glc{grid-column:span 4;grid-row:span 2}#tv .s-metas .pv-k{grid-column:span 2}
#tv .s-metas .pv-k>b{font-size:2.8em}
#tv .pv-gl{display:grid;gap:.6em;overflow:hidden}
#tv .pv-g1{display:flex;align-items:center;gap:.8em;padding:.6em .8em;border-radius:.9em;background:rgba(255,255,255,.06)}
#tv .pv-g1 .pv-e{font-size:1.6em}#tv .pv-g1>div{flex:1;min-width:0;display:grid;gap:.25em}#tv .pv-g1 b{font-size:.96em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tv .pv-g1 small{font-size:.74em;color:rgba(255,255,255,.55)}
#tv .pv-g1 .pv-pc{font:800 1.3em/1 var(--display,inherit)}#tv .pv-g1.ok .pv-pc{color:#6ff0bb}#tv .pv-g1.ok .pv-bar i{background:linear-gradient(90deg,#2fc58a,#6ff0bb)}
/* produção */
#tv .s-producao .pv-g{grid-template-rows:auto 1fr}
#tv .s-producao .pv-pcol,#tv .s-producao .pv-late{grid-column:span 3}
#tv .s-producao .pv-k{grid-column:span 3}
/* revisão */
#tv .s-revisao .pv-g{grid-template-rows:1fr}#tv .s-revisao .pv-rv{grid-column:span 4}
#tv .pv-cn{display:flex;align-items:baseline;gap:.5em;margin-bottom:.7em}#tv .pv-cn b{font:800 4.6em/1 var(--display,inherit);letter-spacing:-.03em}#tv .pv-cn small{font-weight:700;color:rgba(255,255,255,.6)}
#tv .pv-rv.rd .pv-cn b{color:#ff938b}#tv .pv-rv.bl .pv-cn b{color:#8fb8ff}
#tv .pv-ls{overflow:hidden;flex:1;min-height:0}
/* agenda */
#tv .s-agenda .pv-g{grid-template-rows:1fr auto}
#tv .pv-wk{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.9em;min-height:0}
#tv .pv-day{padding:1em .9em}#tv .pv-day.pv-td{border-color:rgba(255,249,82,.55);box-shadow:0 0 0 1px rgba(255,249,82,.25),0 1.4em 3em -1.6em rgba(0,0,0,.6)}
#tv .pv-day .pv-dh{display:flex;align-items:center;gap:.6em;margin-bottom:.7em}#tv .pv-day .pv-dh>b{font:800 2.5em/1 var(--display,inherit)}#tv .pv-day .pv-dh span{font-weight:800;font-size:.92em;display:grid}#tv .pv-day .pv-dh small{font-size:.8em;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.08em}
#tv .pv-day.pv-td .pv-dh>b{color:var(--tvy)}
#tv .pv-day .pv-ev{border-radius:.7em;padding:.4em .65em;margin-bottom:.4em;background:rgba(255,255,255,.07);border-left:.25em solid var(--c)}#tv .pv-day .pv-ev b{display:block;font-size:.8em;line-height:1.2;max-height:2.4em;overflow:hidden}#tv .pv-day .pv-ev small{font-size:.66em;color:rgba(255,255,255,.55)}
#tv .pv-day .pv-ev.pv-z{background:none;border:1px dashed rgba(255,255,255,.14);border-left:1px dashed rgba(255,255,255,.14);text-align:center;padding:.9em 0}
#tv .s-agenda .pv-k{grid-column:span 3}#tv .s-agenda .pv-k>b{font-size:2.6em}
/* publicações / comercial */
#tv .s-publicacoes .pv-g,#tv .s-comercial .pv-g{grid-template-rows:auto 1fr}
#tv .s-publicacoes .pv-pl,#tv .s-comercial .pv-fn{grid-column:span 7}#tv .s-publicacoes .pv-pc,#tv .s-comercial .pv-nx{grid-column:span 5}
#tv .s-comercial .pv-k>b{font-size:2.8em}
/* mural */
#tv .s-mural .pv-g{grid-template-rows:1fr}
#tv .pv-ma{grid-column:span 4;padding:0;border-top:.3em solid var(--c,#4d8dff)}
#tv .pv-ma .pv-im{flex:1.1;min-height:0;background:rgba(255,255,255,.05)}#tv .pv-ma .pv-im img{width:100%;height:100%;object-fit:cover;display:block}
#tv .pv-ma .pv-bd{padding:1.2em 1.4em;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.4em}
#tv .pv-ma .pv-tg{font-size:.76em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
#tv .pv-ma h2{margin:0;font:800 1.7em/1.12 var(--display,inherit)}#tv .pv-ma p{margin:0;color:rgba(255,255,255,.75);font-size:1.02em;line-height:1.4}#tv .pv-ma small{margin-top:auto;color:rgba(255,255,255,.5);font-weight:600}
#tv .pv-ni .pv-bd{justify-content:center;gap:.8em}#tv .pv-ni h2{font-size:2.5em}#tv .pv-ni p{font-size:1.45em}#tv .pv-ni .pv-bd>small{margin-top:1em}
#tv .pv-ma.pv-z{border-top-color:rgba(255,255,255,.15)}
/* ranking */
#tv .s-rank .pv-g{grid-template-rows:1fr}#tv .s-rank .pv-tbl{grid-column:span 8}#tv .s-rank .pv-pod{grid-column:span 4}
#tv .pv-th,#tv .pv-tr{display:grid;grid-template-columns:2.2em minmax(0,2.4fr);grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:.6em;align-items:center}
#tv .pv-th{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:0 .8em .6em}
#tv .pv-th .n,#tv .pv-tr .n{text-align:right}
#tv .pv-tr{padding:.45em .8em;margin-bottom:.4em;border-radius:.9em;background:rgba(255,255,255,.055);font-weight:700;animation:pvrow .6s both;animation-delay:calc(var(--i)*.09s + .4s)}
#tv .pv-tr .pv-pos{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:.85em;font-weight:800}
#tv .pv-tr.pv-p1{background:linear-gradient(90deg,rgba(255,249,82,.16),rgba(255,255,255,.055))}#tv .pv-tr.pv-p1 .pv-pos{background:linear-gradient(135deg,#FFF952,#ffc93c);color:var(--kt-0f2a5c)}
#tv .pv-tr.pv-p2 .pv-pos{background:linear-gradient(135deg,var(--k-e8eef9),#aab7d1);color:var(--kt-0f2a5c)}#tv .pv-tr.pv-p3 .pv-pos{background:linear-gradient(135deg,var(--k-ffc39a),#d88a55);color:var(--kt-3b1b05)}
#tv .pv-tr .pv-nm{display:flex;align-items:center;gap:.7em;min-width:0}#tv .pv-tr .pv-nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tv .pv-tr .pv-nm small{display:none}
#tv .pv-tr .pv-pt b{font:800 1.4em/1 var(--display,inherit);color:var(--tvy)}
#tv .pv-tr.pv-z{opacity:.4}#tv .pv-tr.pv-z .av{background:rgba(255,255,255,.15)}
#tv .pv-pd{flex:1;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:.8em;min-height:0}
#tv .pv-pd>div{display:flex;flex-direction:column;align-items:center;gap:.25em;height:100%;justify-content:flex-end;animation:pvup .8s both;animation-delay:calc(var(--i)*.15s + .5s)}
#tv .pv-pd .pv-md{font-size:1.9em;animation:pvfloat 3.4s ease-in-out infinite}#tv .pv-pd b{font-size:.98em;white-space:nowrap}#tv .pv-pd small{font-size:.76em;color:rgba(255,255,255,.6);font-weight:700}
#tv .pv-pd>div>i{display:block;width:100%;height:var(--h);max-height:6em;min-height:1.6em;border-radius:.8em .8em .3em .3em;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid var(--g2)}
#tv .pv-pd .pv-p1>i{background:linear-gradient(180deg,rgba(255,249,82,.5),rgba(255,249,82,.08))}
#tv .pv-pd .pv-z{opacity:.4}
/* funcionário do mês */
#tv .s-mes .pv-g{grid-template-rows:1fr}#tv .s-mes .pv-hero{grid-column:span 5;align-items:center;justify-content:center;text-align:center;gap:.35em;background:radial-gradient(90% 70% at 50% 0,rgba(255,249,82,.18),rgba(255,255,255,.04));border-color:rgba(255,249,82,.35)}
#tv .s-mes .pv-rkl{grid-column:span 7}
#tv .s-mes .pv-cr{width:3.2em;height:3.2em;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FFF952,#ffc93c);color:var(--kt-0f2a5c);animation:pvfloat 3.6s ease-in-out infinite}#tv .s-mes .pv-cr svg{width:1.7em;height:1.7em;stroke:currentColor;fill:none;stroke-width:2}
#tv .s-mes h2{margin:.2em 0 0;font:800 2.6em/1.05 var(--display,inherit)}#tv .s-mes .pv-hero p{margin:0;color:rgba(255,255,255,.65);font-weight:600}
#tv .s-mes .pv-pts b{font:800 3.6em/1 var(--display,inherit);color:var(--tvy)}#tv .s-mes .pv-pts span{display:block;font-weight:700;color:rgba(255,255,255,.6);font-size:.9em}
#tv .s-mes .pv-pz{margin-top:.5em;background:rgba(255,255,255,.1);padding:.5em 1.1em;border-radius:99px;font-weight:800;font-size:.95em}
#tv .cfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}#tv .cfx i{position:absolute;top:-6%;left:var(--x);width:.7em;height:1.1em;background:var(--c);border-radius:.15em;animation:pvcf 7s linear infinite;animation-delay:var(--d)}
/* foco e telas livres */
#tv .pv-fc{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;gap:.6em;max-width:70em;margin:0 auto;animation:pvup .9s both}
#tv .pv-fc small{font-size:1em;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--tvy);background:rgba(255,249,82,.1);padding:.5em 1.4em;border-radius:99px;border:1px solid rgba(255,249,82,.3)}
#tv .pv-fc h1{margin:.2em 0 0;font:800 5.2em/1.04 var(--display,inherit);letter-spacing:-.03em;background:linear-gradient(180deg,var(--k-ffffff),var(--k-b9cdf5));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#tv .pv-fc p{margin:0;font-size:1.9em;line-height:1.35;color:rgba(255,255,255,.8);font-weight:600;max-width:34em}#tv .pv-fc p.mu{font-size:1.2em;color:rgba(255,255,255,.45)}
#tv .s-cust{display:grid;grid-template-columns:1fr;align-items:stretch}
#tv .s-cust.both{grid-template-columns:1.15fr 1fr;gap:2.4em;align-items:center}
#tv .pv-ci{min-height:0;height:100%;border-radius:1.6em;overflow:hidden;border:1px solid var(--g2);box-shadow:0 2em 4em -2em rgba(0,0,0,.7);background:rgba(255,255,255,.05);animation:pvup .8s both}
#tv .pv-ci img{width:100%;height:100%;object-fit:cover;display:block}
#tv .s-cust.only .pv-ci img{object-fit:contain;background:#000}
#tv .pv-ct{display:grid;gap:.7em;align-content:center;animation:pvup .9s .15s both}
#tv .pv-ct h1{margin:0;font:800 3.8em/1.06 var(--display,inherit);letter-spacing:-.025em}#tv .pv-ct p{margin:0;font-size:1.6em;line-height:1.4;color:rgba(255,255,255,.8);font-weight:600}
#tv .s-cust.txt{place-content:center;text-align:center;justify-items:center}#tv .s-cust.txt .pv-ct{max-width:60em}#tv .s-cust.txt .pv-ct h1{font-size:5em}
/* rodapé */
#tv .tvft{position:absolute;left:0;right:0;bottom:0;height:3.6em;padding:0 3.4em;display:flex;align-items:center;justify-content:space-between}
#tv .tvlg{display:flex;align-items:center}
#tv .tvlg .fl{height:1.9em;width:auto;aspect-ratio:5.0056;background:var(--tvy)}
#tv #tvdots{display:flex;gap:.55em;align-items:center}#tv #tvdots i{width:.55em;height:.55em;border-radius:99px;background:rgba(255,255,255,.22);transition:all .5s}#tv #tvdots i.v-on{width:2em;background:var(--tvy)}
#tv .tvbp{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:.8em;color:rgba(255,255,255,.55)}
#tv #tvck{display:flex;align-items:baseline;gap:.8em}#tv #tvck b{font:800 1.7em/1 var(--display,inherit);letter-spacing:-.01em}#tv #tvck span{font-size:.82em;color:rgba(255,255,255,.6);font-weight:700}

const emk=e=>String(e||'').toLowerCase().replace(/\./g,',');
async function loadMe(){
 let u=await api('GET','users/'+S.uid);
 if(!u){
  const inv=await api('GET','invites/'+emk(S.email)).catch(()=>null);
  if(inv){u={name:inv.name||S.email.split('@')[0],email:S.email,role:'member',cargo:inv.cargo||'',setor:inv.setor||'geral',active:true,created:Date.now()};await api('PUT','users/'+S.uid,u);await api('DELETE','invites/'+emk(S.email)).catch(()=>0)}
  else{try{u={name:S.email.split('@')[0],email:S.email,role:'admin',active:true,created:Date.now()};await api('PUT','users/'+S.uid,u)}catch(e){u=null}}
 }
 if(!u||u.active===false)return null;
 if(u.email!==S.email){u.email=S.email;api('PATCH','users/'+S.uid,{email:S.email}).catch(()=>0)}
 return {...u,uid:S.uid};
}
async function boot(){
 try{ME=await loadMe()}catch(e){ME=null;if(e.code=='SESSAO'){return loginView('Sessão expirada. Entre novamente.')}return loginView('Não foi possível conectar. Verifique a internet e as regras do banco.')}
 if(!ME){S={};try{localStorage.removeItem('bp_rt')}catch(e){}return loginView('Este login não tem acesso ao Blueprint. Fale com um administrador.')}
 shell();await pull(true);
 await ensureComm();try{const sp=pref('start');if(!path()&&sp&&sp!='home'&&PAGES[sp]&&pageOk(sp))history.replaceState({},'','/'+sp)}catch(e){}route();startPolls();
}
function doLogout(){ME=null;S={};stopPolls();try{localStorage.removeItem('bp_rt')}catch(e){}loginView()}

function imgData(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q||.82))};im.src=r.result};r.readAsDataURL(file)})}
function imgSquare(file,n){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(f)});
const mediaCache={};
async function getMedia(mid){if(mediaCache[mid])return mediaCache[mid];const j=await api('GET','media/'+mid);return(mediaCache[mid]=(j&&j.d)||'')}

const cl=(s,f)=>(slug(s)||f).slice(0,60);
async function driveUp(file,pathArr){const d=drv();if(!d.url)throw new Error('DRIVE_OFF');if(file.size>41943040)throw new Error('BIG');const [t,data]=await Promise.all([tok(),b64(file)]);const r=await fetch(d.url,{method:'POST',body:JSON.stringify({token:t,name:file.name,mime:file.type||'application/octet-stream',data,path:pathArr})});const j=await r.json();if(!j.ok)throw new Error(j.error||'ERRO');return {name:file.name,url:j.url,dl:'https://drive.google.com/uc?export=download&id='+j.id,fu:j.folderUrl||'',size:j.size||file.size,by:ME.name,t:Date.now()}}

/* ---------- reordenar o menu lateral arrastando (com confirmação) ---------- */
const NVD={id:null,to:null,pos:0};
function nvClear(){$$('#nav a.nv-b,#nav a.nv-a,#nav a.nv-drag').forEach(a=>a.classList.remove('nv-b','nv-a','nv-drag'))}
document.addEventListener('dragstart',e=>{const a=e.target.closest&&e.target.closest('#nav a[data-p]');if(!a)return;NVD.id=a.dataset.p;NVD.to=null;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',NVD.id)}catch(x){}setTimeout(()=>a.classList.add('nv-drag'),0)});
document.addEventListener('dragover',e=>{if(!NVD.id)return;const a=e.target.closest&&e.target.closest('#nav a[data-p]');if(!a||a.dataset.p==NVD.id){nvClear();if(a)a.classList.add('nv-drag');NVD.to=null;return}e.preventDefault();const r=a.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;nvClear();const d=$('#nav a[data-p="'+NVD.id+'"]');if(d)d.classList.add('nv-drag');a.classList.add(after?'nv-a':'nv-b');NVD.to=a.dataset.p;NVD.pos=after?1:0});
document.addEventListener('drop',e=>{if(!NVD.id)return;if(!(e.target.closest&&e.target.closest('#nav')))return;e.preventDefault();const id=NVD.id,to=NVD.to,pos=NVD.pos;nvClear();NVD.id=null;NVD.to=null;if(!to)return;nvAsk(id,to,pos)});
document.addEventListener('dragend',()=>{nvClear();NVD.id=null;NVD.to=null});
function nvNext(id,to,pos){const ids=navFor().filter(n=>n[0]!='g').map(n=>n[0]),all=NAV.filter(n=>n[0]!='g').map(n=>n[0]).filter(x=>!ids.includes(x)),r=ids.filter(x=>x!=id),i=r.indexOf(to);r.splice(i+pos,0,id);return r.concat(all)}
function nvAsk(id,to,pos){const nx=nvNext(id,to,pos),cur0=navFor().filter(n=>n[0]!='g').map(n=>n[0]);if(nx.slice(0,cur0.length).join()==cur0.join())return;
 const nm=x=>(NAV.find(n=>n[0]==x)||[,x])[1];
 const m=document.createElement('div');m.className='md';m.style.zIndex=80;
 m.innerHTML=`<div class="bx askd" style="width:min(100%,470px)"><div class="adh"><span class="adi" style="background:var(--acs,#e8f0ff);color:var(--ac,#1f66f0)">${ic('layers')}</span><h3>Mudar a ordem do menu?</h3></div><p class="adt">O que vai acontecer:</p><ul class="adl"><li>“${esc(nm(id))}” vai ficar ${pos?'logo abaixo':'logo acima'} de “${esc(nm(to))}”.</li><li>Só o seu menu muda de lugar. Nada dentro do sistema é alterado.</li><li>Você pode voltar ao padrão em Configurações › Preferências.</li></ul><div class="act"><button class="btn o" data-r="0" autofocus>Cancelar</button><button class="btn" data-r="1">Confirmar</button></div></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b||e.target===m){m.remove();if(b&&b.dataset.r=='1')nvSave(nx)}})}

let dragId=null,dragB=null;const DROP={},DZ={};
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.cd[draggable=true]');if(!c)return;dragging=true;dragId=c.dataset.id;dragB=c.dataset.b;document.body.classList.add('dragon');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';setTimeout(()=>c.classList.add('dg'),0)});
document.addEventListener('dragend',()=>{dragging=false;dragId=null;document.body.classList.remove('dragon');$$('.dg,.ov').forEach(x=>x.classList.remove('dg','ov'));setTimeout(onData,50)});
document.addEventListener('dragover',e=>{if(!dragId)return;const dz=e.target.closest('.dzone');$$('.dzone.ov').forEach(x=>x!==dz&&x.classList.remove('ov'));if(dz&&dz.dataset.b==dragB){e.preventDefault();dz.classList.add('ov')}const col=e.target.closest('.col');if(col&&col.dataset.b==dragB){e.preventDefault();$$('.col.ov').forEach(x=>x!==col&&x.classList.remove('ov'));col.classList.add('ov')}
 const kb=e.target.closest('.kb');if(kb){const r=kb.getBoundingClientRect();if(e.clientX<r.left+90)kb.scrollLeft-=22;else if(e.clientX>r.right-90)kb.scrollLeft+=22}
 const cl=e.target.closest('.cl2');if(cl){const r=cl.getBoundingClientRect();if(e.clientY<r.top+50)cl.scrollTop-=14;else if(e.clientY>r.bottom-50)cl.scrollTop+=14}
 if(e.clientY<90)scrollBy(0,-16);else if(e.clientY>innerHeight-90)scrollBy(0,16)});
document.addEventListener('drop',e=>{const dz=e.target.closest('.dzone');if(dragId&&dz&&dz.dataset.b==dragB){e.preventDefault();const i=dragId;dragId=null;dragging=false;document.body.classList.remove('dragon');$$('.ov,.dg').forEach(x=>x.classList.remove('ov','dg'));const zk=dz.dataset.z;if(DZ[zk])DZ[zk](i);else if(zk.indexOf('dest:')==0)destRun(zk.slice(5),i);return}const col=e.target.closest('.col');if(!dragId||!col||col.dataset.b!=dragB)return;e.preventDefault();const i=dragId;dragId=null;dragging=false;$$('.ov,.dg').forEach(x=>x.classList.remove('ov','dg'));if(DROP[dragB])DROP[dragB](i,col.dataset.s)});

async function moveTo(cid,b,stg){
 const c=D.contents[cid];if(!c)return;const cb=c.board||'conteudo';if(!canBoard(cb)){noBoard();return}

 if(b=='conteudo'&&stg=='cliente'&&!await ask('Marcar como "Com o cliente"? Use a aba Validação para gerar o link de aprovação.','Mover'))return;

function crmLiveStop(){crmLiveOn=false;clearTimeout(CRMRT);if(CRMES){CRMES.forEach(e=>{try{e.close()}catch(x){}});CRMES=null}}
async function crmLive(){crmLiveStop();if(!ME||typeof EventSource=='undefined'||(navigator.webdriver&&!window.__crmSSE))return;

 const open=(path,ev)=>{const es=new EventSource(FB.db+'/'+path+'.json?auth='+S.tok);
  es.addEventListener('put',e=>{crmLiveOn=true;ev(e,false)});es.addEventListener('patch',e=>{crmLiveOn=true;ev(e,true)});
  es.addEventListener('auth_revoked',()=>{setTimeout(crmLive,500)});

function crmEvCfg(e,patch){let m;try{m=JSON.parse(e.data)}catch(x){return}const segs=String(m.path||'/').split('/').filter(Boolean);

const crmFlash=new Set();
function crmEv(e,patch){let m;try{m=JSON.parse(e.data)}catch(x){return}
 const segs=String(m.path||'/').split('/').filter(Boolean),data=m.data;
 const put=(sg,v)=>{
  if(!sg.length){D.crm=(v&&typeof v=='object')?v:{};return}
  const lid=sg[0],old=D.crm[lid];setLocal('crm/'+sg.join('/'),v);
  /* quem mexeu: toast para o admin e destaque no card */
  if(sg.length==3&&sg[1]=='acts'&&v&&typeof v=='object'&&v.by&&v.by!=ME.uid&&Date.now()-(+v.t||0)<30000){const l=D.crm[lid];if(l){crmFlash.add(lid);if(isAdm())toast(uname(v.by).split(' ')[0]+' · '+(v.auto?v.text:v.type+': '+v.text)+' · '+l.name)}}
  else if(sg.length==2&&sg[1]=='stage'&&old&&old.stage!==v)crmFlash.add(lid)};
 if(patch&&data&&typeof data=='object'){for(const k in data)put(segs.concat(k),data[k])}else put(segs,data);
 uiTick();setTimeout(()=>{crmFlash.forEach(i=>{const c=document.querySelector('.cd[data-id="'+i+'"]');if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}});crmFlash.clear()},350)}

async function bulkMove(b,ids,stg,reason){const s=stOf(b,stg),patch={},rev={};let n=0,now=Date.now();
 if(b=='crm'&&!crmCan('move')){noSec('crm');return}if(b!='crm'&&!canBoard(b)){noBoard();return}
 ids.forEach((i,k)=>{const o=selItem(b,i);if(!o)return;if(b=='crm'){if(o.stage==stg||effSt('crm',o.stage||'novo')==stg)return}else{if((o.board||'conteudo')!==b||o.stage==stg)return}
  n++;const aid=id()+k,from=stOf(b,b=='crm'?(o.stage||'novo'):o.stage).n;
  if(b=='crm'){const u=s.won?{stage:stg,stAt:now,wonAt:TODAY(),lostReason:null,lostAt:null}:s.lost?{stage:stg,stAt:now,lostAt:TODAY(),lostReason:reason||'Outro',wonAt:null}:{stage:stg,stAt:now,wonAt:null,lostReason:null,lostAt:null};
   if(!s.won&&!s.lost&&o.prob!==undefined&&o.prob!=='')u.prob=null;
   for(const f in u){patch[i+'/'+f]=u[f];rev[i+'/'+f]=o[f]===undefined?null:o[f]}
   patch[i+'/acts/'+aid]={type:'Etapa',text:`Etapa: ${from} → ${s.n}${s.lost?' ('+(reason||'Outro')+')':''} (em massa)`,by:ME.uid,t:now,done:true,auto:true};rev[i+'/acts/'+aid]=null}
  else{patch[i+'/stage']=stg;rev[i+'/stage']=o.stage;patch[i+'/hist/'+aid]={t:now,by:ME.uid,x:`Movido para ${s.n} (em massa)`,k:'m'};rev[i+'/hist/'+aid]=null}});
 if(!n){toast('Esses cards já estão nessa etapa.');return}
 await bulkApply(selNode(b),patch);if(b=='crm'&&s.won&&isAdm())await ensureComm();
 audLog('Moveu '+pl(n,'card','cards')+' em massa','mv',BOARDS[b].n,'Para: '+s.n,'Em massa');
 SEL.ids=new Set();draw(false);selUI();
 toastAct(`${pl(n,'card movido','cards movidos')} para ${s.n}.`,'Desfazer',async()=>{await bulkRestore(selNode(b),rev);toast('Movimento desfeito.')})}

 else{const nf=items.reduce((t,c)=>t+L(c.files).length,0),np=items.reduce((t,c)=>t+Q.prevIds(c).length,0),na=items.reduce((t,c)=>t+L(c.adj).length,0),ncl=items.filter(c=>c.stage=='cliente').length,ent=items.filter(c=>c.deliveredBy).length;

  if(ncl)w.push(`${pl(ncl,'card está','cards estão')} com o cliente: o link de validação continua, mas sem eles.`);
  if(ent)w.push(`${pl(ent,'já foi entregue','já foram entregues')}: os pontos dessas entregas saem da pontuação.`)}
 w.push(b=='crm'?'Dá para restaurar pela lixeira ou pelo botão Desfazer logo depois.':'Você terá alguns segundos para desfazer logo depois.');
 const ok=await askDel({t:opt.zero?`Zerar a etapa "${opt.stage}"?`:`Apagar ${pl(n,'card selecionado','cards selecionados')}?`,w,n:opt.zero?'Todos os cards desta etapa que aparecem agora (respeitando os filtros da tela) serão apagados. A etapa em si continua.':'',sev:n>=10||(b=='crm'&&items.some(l=>l.stage=='ganho')),ok:opt.zero?`Apagar ${n} ${n==1?'card':'cards'}`:`Apagar ${n}`});
 if(!ok)return false;
 const snap={};ids.forEach(i=>{snap[i]=JSON.parse(JSON.stringify(selItem(b,i)))});const patch={};ids.forEach(i=>{patch[i]=null});
 if(b=='crm')await leadTrash(ids,'Apagado');else await bulkApply(selNode(b),patch);
 audLog((opt.zero?'Zerou a etapa ':'Apagou ')+pl(n,'card','cards')+' em massa','del',BOARDS[b].n,opt.zero?opt.stage:'','Em massa',n+' apagados');
 SEL.ids=new Set();if(SEL.on)selOff(true);draw(false);
 toastAct(`${pl(n,'card apagado','cards apagados')}.`,'Desfazer',async()=>{if(b=='crm')await trashRestore(ids);else await bulkRestore(selNode(b),snap);audLog('Restaurou '+pl(n,'card','cards'),'new',BOARDS[b].n,'','Desfazer apagar em massa');toast('Cards restaurados.')},14000);
 return true}

/* ===================== LIXEIRA DE LEADS · NOVO CLIENTE =====================
   Lead que sai do CRM (virou cliente, foi apagado, encerrado ou expirou) vai para a lixeira por 30 dias.
   Venda/perda fica registrada num livro-caixa pequeno (crmLedger) para as metas e a conversão não mudarem. */
const TRASH_D=30,DAYMS=864e5;
const TWHY={'Virou cliente':['#0ca30c','Virou cliente'],'Apagado':['#d03b3b','Apagado'],'Encerrado':['#b7791f','Encerrado'],'Automático':['#6b7a90','Automático']};
const ledgerOf=st=>{const a=L(D.crm).filter(l=>l.stage==st);L(D.crmLedger).forEach(s=>{if(s.stage==st&&!D.crm[s.id])a.push(s)});return a};
const salesAll=()=>ledgerOf('ganho'),lostAllL=()=>ledgerOf('perdido');
const msOf=x=>{const d=pd(x);return d?d.getTime():0};
const leadBase=(l,s)=>Math.max(+l.stAt||0,msOf(l.lostAt),msOf(l.wonAt),+l.created||0,+s.trashFrom||0);
const cl0=o=>JSON.parse(JSON.stringify(o));
/* manda leads para a lixeira. extra = {id:{campos extras}} */
async function leadTrash(ids,why,extra){
 const now=Date.now(),tp={},cp={},lg={},cm={};
 ids.forEach(i=>{const l=D.crm[i];if(!l)return;
  tp[i]={lead:cl0(l),name:l.name||'',stage:l.stage||'novo',why,at:now,by:why=='Automático'?'auto':ME.uid,...((extra&&extra[i])||{})};cp[i]=null;
  if(why!='Apagado'&&(l.stage=='ganho'||l.stage=='perdido'))lg[i]={name:l.name||'',value:num(l.value),stage:l.stage,wonAt:l.wonAt||null,lostAt:l.lostAt||null,lostReason:l.lostReason||null,resp:l.resp||null,board:l.board||null,at:now};
  if(why!='Apagado'&&l.stage=='ganho'&&l.resp&&D.users[l.resp]&&!(D.comm[l.resp]&&D.comm[l.resp][i])&&isAdm()){const pct=comPct(l.resp),base=num(l.value)*comMonths();cm[l.resp+'/'+i]={lead:l.name,base,pct,val:Math.round(base*pct)/100,ref:(l.wonAt||TODAY()).slice(0,7),wonAt:l.wonAt||TODAY(),status:'pendente',t:now}}});
 const n=Object.keys(tp).length;if(!n)return 0;
 if(Object.keys(lg).length)await bulkApply('crmLedger',lg);
 if(Object.keys(cm).length){await W.patch('comm',cm)}
 await bulkApply('crmTrash',tp);   /* primeiro grava na lixeira, depois tira do CRM: nada se perde no meio do caminho */
 await bulkApply('crm',cp);
 return n}
async function trashRestore(ids){
 const rp={},tp={},lg={};let n=0;
 ids.forEach(i=>{const t=D.crmTrash[i];if(!t||!t.lead||D.crm[i])return;rp[i]={...t.lead,stAt:Date.now()};tp[i]=null;if(D.crmLedger[i])lg[i]=null;n++});
 if(!n)return 0;
 await bulkApply('crm',rp);await bulkApply('crmTrash',tp);if(Object.keys(lg).length)await bulkApply('crmLedger',lg);return n}
async function trashPurge(ids){const p={};ids.forEach(i=>p[i]=null);await bulkApply('crmTrash',p)}
/* limpeza automática: apaga o que passou de 30 dias e manda para a lixeira o que ficou parado na etapa */
let sweepT=0;
async function trashSweep(){
 if(!ME||!isAdm()||Date.now()-sweepT<18e4||pending)return;sweepT=Date.now();
 try{const now=Date.now();
  const old=L(D.crmTrash).filter(t=>now-(t.at||0)>=TRASH_D*DAYMS).map(t=>t.id);
  if(old.length)await trashPurge(old);
  const auto=[];stages('crm').forEach(s=>{if(!s.trash)return;const lim=s.trash*DAYMS;L(D.crm).forEach(l=>{if(effSt('crm',l.stage||'novo')!=s.id)return;if(P_crm.cur==l.id&&$('#lm'))return;if(now-leadBase(l,s)>=lim)auto.push(l.id)})});
  if(auto.length){const n=await leadTrash(auto,'Automático');if(n){audLog('Lixeira automática: '+pl(n,'lead','leads'),'del','CRM','','Automático');toast(pl(n,'lead foi','leads foram')+' para a lixeira (tempo na etapa).');draw(false)}}
 }catch(e){console.error(e)}}

 return `<div class="pn"><div class="hd"><div><h3>Equipe</h3><p class="sub">Contas de acesso · função · permissões.</p></div><button class="btn" data-a="usrNew">${ic('plus')}Adicionar membro</button></div><table class="tb"><thead><tr><th>Pessoa</th><th>Cargo</th><th>Perfil</th><th>Função</th><th>Comissão</th><th>Situação</th><th></th></tr></thead><tbody>${us.map(u=>`<tr class="urw" data-a="usrEdit" data-u="${u.id}" title="Clique para editar"><td><div style="display:flex;gap:10px;align-items:center">${uav(u,'m')}<div><b>${esc(u.name)}</b>${u.id==ME.uid?' <small>(você)</small>':''}<br><small style="color:var(--mu)">${esc(u.email||'')}</small></div></div></td><td>${esc(u.cargo||'—')}</td><td>${u.role=='admin'?stBadge('Administrador','on'):stBadge('Membro')}</td><td>${u.role=='admin'?'<small style="color:var(--mu)">todos</small>':esc(SETORES[u.setor||'geral'])}</td><td>${u.comm!=null&&u.comm!==''?u.comm+'%':'padrão'}</td><td>${u.active===false?stBadge('Desativado','of'):stBadge('Ativo','on')}</td><td class="ac"><button class="btn o sm" data-a="usrEdit" data-u="${u.id}">${ic('pen')}Editar</button></td></tr>`).join('')}</tbody></table></div>`}
A.usrNew=()=>modal(`<div class="hh"><h3>Adicionar membro</h3><button type="button" class="ib" data-a="mclose">${ic('x')}</button></div><div class="fg2"><label class="w">Nome<input name="name" required></label><label class="w">E-mail de login<input type="email" name="email" required></label><label>Cargo<input name="cargo"></label><label>Perfil<select name="role"><option value="member">Membro</option><option value="admin">Administrador</option></select></label><label class="w">Função <span class="hint">(define visibilidade e permissões de edição)</span><select name="setor">${Object.entries(SETORES).map(([k,v])=>`<option value="${k}" ${(''||'geral')==k?'selected':''}>${v} — ${SETOR_DESC[k]}</option>`).join('')}</select></label><label class="w">Senha temporária<input name="pw" value="${tokn().slice(0,10)}" required minlength="6"><span class="hint">Senha provisória · o membro pode alterá-la em Configurações › Conta.</span></label></div><div class="er" id="pe" style="color:var(--rd)"></div><div class="act"><button type="button" class="btn o" data-a="mclose">Cancelar</button><button class="btn">Criar acesso</button></div>`,{submit:async f=>{const o=form2(f),e=$('#pe');if(!o.name.trim()||!o.email.trim()||o.pw.length<6){e.textContent='Preencha nome, e-mail e uma senha de ao menos 6 caracteres.';return false}
  try{const j=await idt('signUp',{email:o.email.trim(),password:o.pw,returnSecureToken:false});await W.set('users/'+j.localId,{name:o.name.trim(),email:o.email.trim().toLowerCase(),role:o.role,cargo:o.cargo.trim(),setor:o.setor||'geral',active:true,created:Date.now()});toast('Acesso criado. Envie o e-mail e a senha temporária para '+o.name.split(' ')[0]+'.')}
  catch(x){if(x.code=='EMAIL_EXISTS'){await W.set('invites/'+emk(o.email.trim()),{name:o.name.trim(),cargo:o.cargo.trim(),setor:o.setor||'geral'});try{await idt('sendOobCode',{requestType:'PASSWORD_RESET',email:o.email.trim()})}catch(z){}toast('Este e-mail já tinha login. Liberamos o acesso e enviamos um e-mail para ele definir uma nova senha.')}else{e.textContent=x.message;return false}}}});
A.usrEdit=d=>{const u=D.users[d.u],me=d.u==ME.uid;modal(`<div class="hh"><div style="display:flex;gap:12px;align-items:center">${uav({...u,id:d.u},'m')}<div><h3>${esc(u.name)}</h3><p class="hint">${esc(u.email||'')}</p></div></div><button type="button" class="ib" data-a="mclose">${ic('x')}</button></div><div class="fg2"><label class="w">Nome<input name="name" value="${esc(u.name)}" required></label><label>Cargo<input name="cargo" value="${esc(u.cargo||'')}"></label><label>Comissão (%)<input name="comm" value="${u.comm!=null?u.comm:''}" placeholder="padrão do sistema"></label><label>Perfil<select name="role" ${me?'disabled':''}><option value="member" ${u.role!='admin'?'selected':''}>Membro</option><option value="admin" ${u.role=='admin'?'selected':''}>Administrador</option></select></label><label>Situação<select name="active" ${me?'disabled':''}><option value="1" ${u.active!==false?'selected':''}>Ativo</option><option value="0" ${u.active===false?'selected':''}>Desativado (sem acesso)</option></select></label><label class="w">Função <span class="hint">(define visibilidade e permissões de edição)</span><select name="setor">${Object.entries(SETORES).map(([k,v])=>`<option value="${k}" ${(u.setor||'geral')==k?'selected':''}>${v} — ${SETOR_DESC[k]}</option>`).join('')}</select></label><label>No time desde<input type="date" name="joined" value="${esc(u.joined||(u.created?ymd(new Date(u.created)):''))}"></label></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn o sm" href="/perfil?u=${d.u}" data-l>Ver perfil</a><button type="button" class="btn o sm" data-a="usrPerm" data-u="${d.u}">${ic('shield')}Acessos detalhados</button><button type="button" class="btn o sm" data-a="pfEdit" data-u="${d.u}">${ic('pen')}Editar perfil</button><button type="button" class="btn o sm" data-a="usrReset" data-u="${d.u}">Enviar redefinição de senha</button>${me?'':`<button type="button" class="btn d sm" data-a="usrDel" data-u="${d.u}">Remover acesso</button>`}</div><div class="act"><button type="button" class="btn o" data-a="mclose">Cancelar</button><button class="btn">Salvar</button></div>`,{submit:async f=>{const o=form2(f),upd={name:o.name.trim(),cargo:o.cargo.trim(),setor:o.setor||'geral',comm:o.comm===''?null:num(o.comm),joined:o.joined||null};if(!me){upd.role=o.role;upd.active=o.active=='1'}await W.patch('users/'+d.u,upd);toast('Membro atualizado.');if(me){ME={...ME,...upd};shell();route()}}})};
A.usrReset=async d=>{try{await idt('sendOobCode',{requestType:'PASSWORD_RESET',email:D.users[d.u].email});toast('E-mail de redefinição enviado.')}catch(x){toast(x.message,1)}};
A.usrDel=async d=>{const u=D.users[d.u],nc=L(D.contents).filter(c=>[c.resp,c.designer,c.editor].includes(d.u)).length,nl=L(D.crm).filter(l=>l.resp==d.u).length;if(!await askDel({t:'Remover o acesso de '+u.name+'?',w:['Ele não consegue mais entrar no sistema.',(nc||nl?pl(nc,'card','cards')+' e '+pl(nl,'lead','leads')+' dele continuam, mas ficam com um responsável que não existe mais.':'Ele não tem cards nem leads sob responsabilidade.'),'Os pontos e entregas dele saem dos rankings.'],n:'Para apagar o login de vez, exclua também o usuário no console do Firebase.',sev:1,ok:'Remover acesso'}))return;await W.del('users/'+d.u);closeModal();toast('Acesso removido.')};
/* sistema */
A.cfgPerm=async(d,e)=>{await W.set('config/perms/memberEdit',e.target.checked);toast(e.target.checked?'Membros agora podem editar.':'Membros apenas visualizam e movem cards.')};
const drCfg=()=>{const o=form2($('#df'));o.url=o.url.trim();o.root=o.root.trim()||'Blueprint';return o};

A.backup=async()=>{const o={_export:new Date().toISOString()};for(const k of['users','clients','contents','crm','comm','tgoals','config','approvals','meta']){o[k]=await api('GET',k).catch(()=>null)}dlFile('blueprint-backup-'+TODAY()+'.json',JSON.stringify(o,null,1),'application/json');toast('Backup baixado.')};

/* ===================== INÍCIO simplificado (social media · designer · videomaker) ===================== */
function homeLite(){
 const now=new Date(),wd=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][now.getDay()];
 const wip=Q.cts().filter(c=>!['agendado','aprcli'].includes(c.stage)&&c.stage!='entrega');
 const dueOf=c=>c.board=='conteudo'?c.date:c.due;
 const mine=wip.filter(c=>[c.resp,c.designer,c.editor].includes(ME.uid)).sort((a,b)=>(dueOf(a)||'9')>(dueOf(b)||'9')?1:-1);
 const late=wip.filter(Q.isLate).sort((a,b)=>(dueOf(a)||'9')>(dueOf(b)||'9')?1:-1);
 const wk=wip.filter(c=>{const d=dueOf(c);return d&&d>=TODAY()&&d<=addD(TODAY(),7)});
 const li=c=>`<li data-a="goK" data-i="${c.id}">${dtBox(dueOf(c),Q.isLate(c))}<div style="min-width:0"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</b><small>${esc(cname(c.client))} · ${esc(stOf(c.board,c.stage).n)}</small></div></li>`;
 const b0=myBoards()[0],stg=stages(b0).map(s=>({n:s.n,v:wip.filter(c=>c.board==b0&&c.stage==s.id).length,c:s.c}));
 const area=b0=='conteudo'?'Conteúdos':BOARDS[b0].n;
 const todo=mine.filter(c=>dueOf(c)&&dueOf(c)<=TODAY()).length;
 return `<div class="hero"><div><div class="eb">Blueprint · Início</div><h1>${brHello()}, <i>${esc(ME.name.split(' ')[0])}.</i></h1><p>${wd}, ${now.getDate()} de ${MES[now.getMonth()].toLowerCase()} · ${todo?`você tem <b>${todo}</b> ${todo==1?'item':'itens'} para hoje ou atrasados`:'nada urgente para você hoje'}.</p></div><div class="tvbw"><button class="btn tvb" data-a="tvOpen" title="Abrir o Painel nesta tela">${ic('tv')}Painel</button><button class="btn o tvb" data-a="tvTab" title="Abrir o Painel em outra aba, para levar à segunda tela">${ic('screen')}2ª tela</button></div></div>${muralHtml()}
 <div class="kp">
  <div class="k hl" style="animation-delay:.05s"><small>${esc(area)} em produção</small><b>${wip.length}</b><span>itens abertos na sua área</span></div>
  <div class="k" style="animation-delay:.1s"><small>Minha fila</small><b>${mine.length}</b><span>${mine.length?'atribuídos a você':'nada atribuído a você'}</span></div>
  <div class="k" style="animation-delay:.15s"><small>Próximos 7 dias</small><b>${wk.length}</b><span>com prazo na semana</span></div>
  <div class="k" style="animation-delay:.2s"><small>Em atraso</small><b>${late.length}</b><span>${late.length?`<b style="color:var(--rd)">pedem atenção</b>`:'tudo no prazo'}</span></div>
 </div>
 <div class="gr g3" style="margin-bottom:14px">
  <div class="pn" style="animation-delay:.1s"><div class="hd"><div><h3>Minha fila</h3><p class="sub">O que está atribuído a você, por prazo.</p></div><a href="/criativos" data-l>Abrir</a></div><ul class="ul">${(mine.length?mine:wip.sort((a,b)=>(dueOf(a)||'9')>(dueOf(b)||'9')?1:-1)).slice(0,6).map(li).join('')||'<li class="emp" style="display:block;cursor:default">Nada na fila agora.</li>'}</ul></div>
  <div class="pn" style="animation-delay:.15s"><h3>Em atraso</h3><p class="sub">Prazos vencidos.</p><ul class="ul">${late.slice(0,6).map(li).join('')||'<li class="emp" style="display:block;cursor:default">Nenhum atraso. Excelente!</li>'}</ul></div>
  <div class="pn" style="animation-delay:.2s"><h3>Por etapa</h3><p class="sub">Onde estão os itens de ${esc(area.toLowerCase())}.</p>${wip.length?hbars(stg):empty('Nada em andamento.')}</div>
 </div>`}

/* ===================== CARTEIRO · agendamento e publicação no Instagram ===================== */
const CT={cl:'',st:''};
const PST={rascunho:['Rascunho','nu'],agendado:['Agendado','wn'],publicado:['Publicado','on'],falhou:['Falhou','of'],cancelado:['Cancelado','nu']};
const DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
const ctCfg=()=>(D.config&&D.config.carteiro)||{};
const ctSrv=()=>!!(ctCfg().api&&ctCfg().appId);
const igOf=c=>(D.carteiro&&D.carteiro.ig&&D.carteiro.ig[c])||null;
const igSt=c=>{const g=igOf(c);if(!g||g.status!='on')return {k:'off',t:'Não conectado',on:0};if(g.exp&&g.exp<Date.now())return {k:'of',t:'Conexão expirou',on:0};const d=g.exp?Math.ceil((g.exp-Date.now())/864e5):null;return d!=null&&d<=7?{k:'wn',t:'Expira em '+d+' d',on:1}:{k:'on',t:'Conectado',on:1}};
const ctPosts=()=>L(D.carteiro&&D.carteiro.posts);
const ctVid=t=>t=='reels';
const ctBadge=t=>`<span class="kt ${ctVid(t)?'v':'p'}">${ic(ctVid(t)?'video':'photo')}${esc(TYPES[t||'feed'])}</span>`;
const ctDay=s=>{const n=dd(s),d=pd(s);return (n==0?'Hoje':n==1?'Amanhã':n==-1?'Ontem':DSEM[d.getDay()].replace(/^./,x=>x.toUpperCase()))+' · '+d.getDate()+' de '+MES[d.getMonth()].toLowerCase()};
const ctAt=(date,time)=>{const d=pd(date);if(!d||!time)return 0;const [h,m]=time.split(':').map(Number);d.setHours(h||0,m||0,0,0);return d.getTime()};
const ctAv=(cid,sz)=>{const n=cname(cid);return `<span class="cta" style="--c:${ccolor(cid)};${sz?`width:${sz}px;height:${sz}px`:''}">${esc(ini(n))}</span>`};

const ctImgOk=u=>/^data:image\//.test(u||'')||/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u||'');
const ctLoad=new Set();
function ctPrev(mid){if(mediaCache[mid])return mediaCache[mid];if(!ctLoad.has(mid)){ctLoad.add(mid);getMedia(mid).then(()=>uiTick()).catch(()=>{})}return ''}
const ctThumb=o=>{let u=(o.media||[]).find(ctImgOk)||'';const c=o.content&&D.contents[o.content];if(!u&&c){const i0=Q.prevIds(c)[0];if(i0)u=ctPrev(i0)}return u};
const ctVis=(u,type,cid)=>`<div class="ctvi" style="--c:${ccolor(cid)}">${u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="ctph">${ic(ctVid(type)?'video':'photo')}</span>`}<span class="ctfm ${ctVid(type)?'v':'p'}">${ic(ctVid(type)?'video':'photo')}${esc(TYPES[type||'feed'])}</span>`;
const CTH={};
const ctDot=k=>`<i class="d ${k}"></i>`;

function ctReady(c){
 const can=canPost(),u=ctThumb({content:c.id});
 return `<article class="ctc" data-id="r${c.id}">${ctVis(u,c.type,c.client)}<span class="ctrdy">Pronto</span></div><div class="ctvb"><b>${esc(c.title)}</b><small>${c.date?'Data planejada '+fd(c.date):'Aprovado pelo cliente'}</small>${can?`<button class="btn sm" data-a="ctFrom" data-i="${c.id}">${ic('send')}Agendar</button>`:''}</div></article>`}

function ctCard(p){
 const s=PST[p.status]||PST.rascunho,can=canPost(),late=p.status=='agendado'&&p.at<Date.now()-6e4&&p.mode!='auto',u=ctThumb(p);
 const chip=late?['Atrasado','of']:[s[0],p.status=='agendado'?'wn':p.status=='publicado'?'on':p.status=='falhou'?'of':'nu'];
 const act=!can?'':p.status=='agendado'||p.status=='falhou'?(p.mode=='auto'?`<button class="btn o sm" data-a="ctNow" data-i="${p.id}" title="Sai em até 1 minuto">${p.status=='falhou'?'Tentar de novo':'Publicar agora'}</button>`:`<button class="btn o sm" data-a="ctDone" data-i="${p.id}">${ic('check')}Já publiquei</button>`):'';
 return `<article class="ctv ${p.status}${late?' late':''}" data-id="${p.id}" data-a="ctEdit" data-i="${p.id}" tabindex="0">${ctVis(u,p.type,p.client)}<span class="cts2 ${chip[1]}">${chip[0]}</span><span class="ctwhen">${ic('cal')}${p.date?esc(DSEM[pd(p.date).getDay()])+' '+fd(p.date):'—'} · ${esc(p.time||'')}</span></div><div class="ctvb"><b>${esc(p.title||'Sem título')}</b><small>${p.mode=='auto'?'Publica sozinho':'Publicação manual'}</small>${p.status=='falhou'&&p.err?`<div class="cter">${esc(String(p.err).slice(0,110))}</div>`:''}${late?`<div class="cter wn">Passou do horário</div>`:''}${p.status=='publicado'&&p.link?`<a class="ctlk" href="${esc(p.link)}" target="_blank" rel="noopener">Ver no Instagram ↗</a>`:''}${act}</div></article>`}

function ctBlock(c,ps,ready,full){
 const can=canPost(),g=igOf(c.id),s=igSt(c.id),cid=c.id;
 const mine=ps.filter(p=>p.client==cid),rd=ready.filter(x=>x.client==cid);
 const sch=mine.filter(p=>['agendado','falhou','rascunho'].includes(p.status)).sort((a,b)=>((a.status=='falhou'?0:1)-(b.status=='falhou'?0:1))||(a.at||0)-(b.at||0));
 const done=mine.filter(p=>p.status=='publicado').sort((a,b)=>(b.at||0)-(a.at||0));
 const nA=mine.filter(p=>p.status=='agendado').length,nF=mine.filter(p=>p.status=='falhou').length;
 const pill=`<span class="ctp ${s.k}"><i></i>${esc(s.t)}</span>`;
 return `<section class="ctk" data-id="k${cid}"><header class="ctkh">${ctAv(cid,40)}<div class="ctkn"><b ${full?'':`data-a="ctSel" data-c="${cid}" style="cursor:pointer"`}>${esc(c.name)}</b><small>${g&&g.user?esc(g.user):'<i>sem @usuário</i>'} ${pill}</small></div>
  <div class="ctkc">${rd.length?`<span><i class="d y"></i>${rd.length} pronto${rd.length>1?'s':''}</span>`:''}<span><i class="d wn"></i>${nA} agendado${nA==1?'':'s'}</span>${nF?`<span class="bad"><i class="d of"></i>${nF} falha${nF>1?'s':''}</span>`:''}<span><i class="d on"></i>${done.length} publicado${done.length==1?'':'s'}</span></div>
  ${can?`<div class="ctka"><button class="btn o sm" data-a="ctAcc" data-c="${cid}">${ic('ig')}${s.on?'Conta':'Conectar'}</button><button class="btn sm" data-a="ctNew" data-c="${cid}">${ic('plus')}Agendar</button></div>`:''}</header>
  ${rd.length?`<div class="ctsh">Prontos para agendar <em>${rd.length}</em></div><div class="ctg">${rd.map(ctReady).join('')}</div>`:''}
  <div class="ctsh">Agenda <em>${sch.length}</em></div>
  <div class="ctg">${sch.map(ctCard).join('')}${can?`<button type="button" class="cta3" data-a="ctNew" data-c="${cid}">${ic('plus')}<b>Agendar conteúdo</b><small>${rd.length?'ou escolha um pronto acima':'novo post, reels ou stories'}</small></button>`:''}</div>
  ${done.length?`<button type="button" class="cth2" data-a="ctHist" data-c="${cid}">${CTH[cid]?'Ocultar':'Ver'} publicados (${done.length})</button>${CTH[cid]?`<div class="ctg sm">${done.slice(0,12).map(ctCard).join('')}</div>`:''}`:''}
 </section>`}

PAGES.publicacoes={t:'Agendamentos',parts(){
 const can=canPost(),cl=L(D.clients).filter(c=>(c.status||'ativo')!='encerrado').sort((a,b)=>a.name>b.name?1:-1);
 const ps=ctPosts().filter(p=>p.status!='cancelado'),sel=CT.cl&&D.clients[CT.cl]?CT.cl:'';
 const ready=Q.cts().filter(c=>agReady(c)&&!ctPosts().some(p=>p.content==c.id&&p.status!='cancelado'));
 const now=Date.now(),mm=ym(new Date());
 const nAg=ps.filter(p=>p.status=='agendado').length,nPub=ps.filter(p=>p.status=='publicado'&&(p.pubAt?ymd(new Date(p.pubAt)).slice(0,7):(p.date||'').slice(0,7))==mm).length,nFa=ps.filter(p=>p.status=='falhou').length;
 const nLate=ps.filter(p=>p.status=='agendado'&&p.at<now-6e4&&p.mode!='auto').length,conn=cl.filter(c=>igSt(c.id).on).length;
 const stat=`<div class="cts"><span>${ctDot('y')}<b>${ready.length}</b> prontos para agendar</span><span>${ctDot('wn')}<b>${nAg}</b> agendados</span><span>${ctDot('on')}<b>${nPub}</b> publicados no mês</span><span class="${nFa||nLate?'bad':''}">${ctDot('of')}<b>${nFa+nLate}</b> ${nFa+nLate==1?'pede':'pedem'} atenção</span><span>${ctDot('nu')}<b>${conn}/${cl.length}</b> contas conectadas</span></div>`;
 const banner=ctSrv()?'':`<div class="ctb"><div class="ctbi">${ic('mail')}</div><div><b>Publicação manual por enquanto</b><p>Agende normalmente: na hora do post o sistema te lembra e você publica. Para publicar sozinho, é preciso ligar a integração com o Instagram.</p></div>${isAdm()?`<button class="btn y sm" data-a="ctSetup">Ativar integração</button>`:''}</div>`;
 const info=c=>({r:ready.filter(x=>x.client==c.id).length,a:ps.filter(p=>p.client==c.id&&p.status=='agendado').length,f:ps.filter(p=>p.client==c.id&&p.status=='falhou').length});

 const m=e.target.closest('.md'),f=m.querySelector('form'),o=form2(f),p=m.__p||{},stt=d.s;
 if(!o.client||!o.title.trim()){toast('Escolha o cliente e dê um título.',1);return}

 if(stt=='agendado'){if(!at){toast('Defina data e hora.',1);return}

function imgFit(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let qq=q||.8,u=c.toDataURL('image/jpeg',qq);while(u.length>900000&&qq>.35){qq-=.1;u=c.toDataURL('image/jpeg',qq)}res(u)};im.src=r.result};r.readAsDataURL(file)})}
function dlRaw(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.28);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}}

/* ---------- abertura animada (primeira vez da sessão) ---------- */
function splash(force){if(/^\/?painel\/?$/.test(location.pathname))return;try{if(!force){if(navigator.webdriver||sessionStorage.getItem('bp_spl'))return;if(!pref('splash'))return}sessionStorage.setItem('bp_spl','1')}catch(e){return}
 const el=document.createElement('div');el.id='spl';el.innerHTML='<i class="sg"></i><i class="sp"></i><i class="cr c1"></i><i class="cr c2"></i><i class="cr c3"></i><i class="cr c4"></i><div class="sl"><span class="sm"></span><span class="sw"><i></i></span></div><span class="sbr"><i></i></span>';document.documentElement.classList.add('splOn');document.body.appendChild(el);
 window.__splBusy=true;const t0=performance.now();let ready=false,done=false;
 /* só começa a animar depois das imagens estarem decodificadas, para não travar no primeiro quadro */
 let on=false;const go=()=>{if(on)return;on=true;requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('go')))};
 try{const rs=getComputedStyle(document.documentElement),im=['--mkc','--wd'].map(k=>{const m=(rs.getPropertyValue(k)||'').match(/url\(([^)]+)\)/);if(!m)return null;const i=new Image();i.src=m[1].replace(/['"]/g,'');return i.decode?i.decode().catch(()=>0):0});Promise.all(im).then(go);setTimeout(go,400)}catch(e){go()}
 /* a saída espera o sistema terminar de montar a primeira tela, para o desaparecer ser limpo (sem trabalho pesado no meio) */
 const fin=()=>{el.classList.add('out');setTimeout(()=>{el.remove();document.documentElement.classList.remove('splOn');window.__splBusy=false;window.splReady=null;try{onData()}catch(e){}},700)};
 const tryOut=()=>{if(done)return;const el0=performance.now()-t0;if(!ready&&el0<6500)return;const left=2400-el0;if(left>0){setTimeout(tryOut,left);return}done=true;requestAnimationFrame(()=>requestAnimationFrame(()=>{(window.requestIdleCallback||(f=>setTimeout(f,80)))(fin,{timeout:500})}))};
 window.splReady=()=>{ready=true;tryOut()};setTimeout(tryOut,6600);
 el.addEventListener('click',()=>{if(done)return;done=true;fin()})}

  try{await api('PUT',`chat/${ch}/${k}`,m);await api('PUT',`meta/${ch}`,{t:m.t,u:ME.uid});D.meta[ch]={t:m.t,u:ME.uid};audLog('Abriu chamada de suporte','new','Suporte',x.slice(0,80),'Chamada');toast('Chamada enviada para '+uname(to)+'. A resposta chega no chat.')}

const onc=h=>lum(h)>.58?'#10244a':'#ffffff';

A.audDel=()=>{if(!isAdm())return;const rows=audList(),all=L(D.audit).filter(r=>r&&r.t),more=all.length>=AUDN?'+':'';
 modal(`<div class="hh"><div><h3>Apagar registros do histórico</h3><p class="hint">Nada some na hora: o apagamento só acontece <b>1 hora depois</b> e você pode cancelar até lá.</p></div><button type="button" class="ib" data-a="mclose" aria-label="Fechar">${ic('x')}</button></div>
 <div class="fg2"><label class="w">O que apagar<select name="sc"><option value="f">Os ${rows.length} registros que aparecem agora (filtro atual)</option><option value="30">Registros com mais de 30 dias</option><option value="90">Registros com mais de 90 dias</option><option value="180">Registros com mais de 180 dias</option><option value="all">Todos os registros até agora (${all.length}${more})</option></select></label></div>
 <div class="act"><button type="button" class="btn o" data-a="mclose">Cancelar</button><button class="btn d" type="submit">Continuar</button></div>`,
 {submit:async f=>{const o=form2(f),now=Date.now();let req={by:ME.uid,n:ME.name,at:now,due:now+AUDH},cnt=0;
  if(o.sc=='f'){if(!rows.length){toast('Nenhum registro neste filtro.',1);return false}req.ids={};rows.slice(0,800).forEach(r=>req.ids[r.id]=true);cnt=Object.keys(req.ids).length;req.lbl=cnt+' registro'+(cnt==1?'':'s')+' do filtro atual'}

const M_AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789',M_ID='abcdefghijklmnopqrstuvwxyz0123456789';
const mtRand=(n,al)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>al[x%al.length]).join('')};
const mtB64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const mtUn=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const mtNorm=p=>String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

async function mtKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(mtNorm(pw)),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function mtEnc(k,o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(o)));return mtB64(iv)+'.'+mtB64(new Uint8Array(ct))}
async function mtDec(k,s){const [a,b]=String(s).split('.'),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:mtUn(a)},k,mtUn(b));return JSON.parse(new TextDecoder().decode(pt))}

async function mtRun(o){

 try{await mtJoin();st.joined=true}catch(e){return mtEnd(e&&e.full?'A sala está cheia: só 2 pessoas por chamada.':'Não foi possível entrar na sala agora. Confira a internet e tente de novo.',true)}

 if(st.role=='h'){await mtApi('PUT',base+'/h',{c:st.cid,t:Date.now(),n:await mtEnc(st.key,{n:st.me})})}

  const g=await mtApi('GET',base+'/g');if(g&&g.c&&g.c!=st.cid&&Date.now()-(g.t||0)<20000){const e=new Error('full');e.full=1;throw e}
  await mtApi('PUT',base+'/g',{c:st.cid,t:Date.now(),n:await mtEnc(st.key,{n:st.me})});
  await new Promise(r=>setTimeout(r,350));const g2=await mtApi('GET',base+'/g');if(!g2||g2.c!=st.cid){const e=new Error('full');e.full=1;throw e}}}
async function mtBeat(){const st=MT;if(mtGone())return;try{await mtApi('PATCH','meet/'+st.id+'/'+st.role,{t:Date.now()})}catch(e){}}
async function mtPoll(){const st=MT;if(mtGone()||st.busy)return;st.busy=1;
 try{const r=await mtApi('GET','meet/'+st.id);if(mtGone())return;
  if(!r||!r.info){return mtEnd('A reunião foi encerrada.',true)}

   const g=r.g,fresh=g&&g.c&&Date.now()-(g.t||0)<15000;
   if(fresh&&g.c!=st.gc){st.gc=g.c;try{st.names.g=(await mtDec(st.key,g.n)).n}catch(e){st.names.g='Convidado'}mtPn();await mtOffer()}
   else if(!fresh&&st.gc){st.gc=null;st.sess=null;mtClosePc();mtWaiting('Aguardando o convidado entrar…','O convidado saiu. Você pode reenviar o link.')}
  }else{
   const h=r.h,fresh=h&&h.c&&Date.now()-(h.t||0)<20000;
   if(h&&h.n&&!st.names.h){try{st.names.h=(await mtDec(st.key,h.n)).n;mtPn()}catch(e){}}
   if(fresh)st.hostSeen=Date.now();
   if(!fresh&&Date.now()-st.hostSeen>20000&&!st.conn)mtWaiting('Aguardando o anfitrião…','O anfitrião ainda não entrou na sala.');
   if(r.g&&r.g.c!=st.cid&&Date.now()-(r.g.t||0)<15000)return mtEnd('Outra pessoa entrou com este link. Só 2 pessoas por chamada.',true)}
  const sg=r.sig||{};

   let d;try{d=await mtDec(st.key,m.d)}catch(e){continue}await mtSig(d)}
