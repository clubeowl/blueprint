/* ---------- WebRTC ---------- */
function mtNewPc(){const st=MT;mtClosePc();const pc=new RTCPeerConnection({iceServers:st.ice||mtIce(),bundlePolicy:'max-bundle'});st.pc=pc;mtDcNew(pc);
 if(st.role=='h'){const ta=pc.addTransceiver('audio',{direction:'sendrecv'}),tv=pc.addTransceiver('video',{direction:'sendrecv'});st.sa=ta.sender;st.sv=tv.sender;mtAttach()}
 pc.ontrack=e=>{const rv=$('#mtr');if(!rv)return;if(!st.rs)st.rs=new MediaStream();if(!st.rs.getTracks().includes(e.track))st.rs.addTrack(e.track);
  if(rv.srcObject!==st.rs)rv.srcObject=st.rs;rv.muted=false;rv.volume=1;mtPlay(rv)};
 pc.onconnectionstatechange=()=>{if(MT!==st||st.pc!==pc)return;const s=pc.connectionState;
  if(s=='connected'){st.conn=true;if(!st.t0)st.t0=Date.now();const w=$('#mtw');if(w)w.classList.add('off');mtStat('Conectado');mtQual()}
  else if(s=='connecting')mtStat('Conectando…');
  else if(s=='disconnected'){mtStat('Conexão instável…');clearTimeout(st.dcT);st.dcT=setTimeout(()=>{if(MT===st&&st.pc===pc&&pc.connectionState!='connected')mtRetry()},7000)}
  else if(s=='failed'){mtStat('Conexão caiu');mtRetry()}};
 return pc}
function mtAttach(){const st=MT,a=st.local.getAudioTracks()[0],v=(st.scr||st.local.getVideoTracks()[0]);
 for(const t of st.pc.getTransceivers()){const k=t.receiver&&t.receiver.track&&t.receiver.track.kind;if(!k)continue;if(st.role=='g'){try{t.direction='sendrecv'}catch(e){}if(k=='audio')st.sa=t.sender;else st.sv=t.sender}
  if(k=='audio'&&a)t.sender.replaceTrack(a);if(k=='video'&&v)t.sender.replaceTrack(v)}}
function mtPlay(rv){const p=rv.play&&rv.play();if(p&&p.catch)p.catch(()=>{const sg=rv.parentNode;if(!sg||sg.querySelector('.mt-snd'))return;const b=document.createElement('button');b.type='button';b.className='btn mt-snd';b.innerHTML=ic('mic')+'Ativar o som';b.onclick=()=>{rv.muted=false;rv.play().catch(()=>0);b.remove()};sg.appendChild(b)})}
function mtClosePc(){const st=MT;if(!st||!st.pc)return;st.rs=null;st.dc=null;st.sendId=null;try{st.pc.onconnectionstatechange=null;st.pc.close()}catch(e){}st.pc=null;st.conn=false;const rv=$('#mtr');if(rv)rv.srcObject=null}
function mtGather(pc){return new Promise(res=>{if(pc.iceGatheringState=='complete')return res();let t0=null;const done=()=>{pc.removeEventListener('icegatheringstatechange',f);pc.removeEventListener('icecandidate',c);res()};
 const f=()=>{if(pc.iceGatheringState=='complete')done()},c=e=>{if(e.candidate&&/ typ (srflx|relay) /.test(e.candidate.candidate)&&!t0)t0=setTimeout(done,400)};
 pc.addEventListener('icegatheringstatechange',f);pc.addEventListener('icecandidate',c);setTimeout(done,2500)})}
async function mtSend(o){const st=MT;if(mtGone())return;const k=Date.now().toString(36)+mtRand(5,M_ID);await mtApi('PUT','meet/'+st.id+'/sig/'+k,{f:st.role,t:Date.now(),d:await mtEnc(st.key,o)})}
async function mtOffer(){const st=MT;if(mtGone()||st.role!='h')return;
 try{const old=await mtApi('GET','meet/'+st.id+'/sig');if(old)for(const k of Object.keys(old))mtApi('DELETE','meet/'+st.id+'/sig/'+k).catch(()=>0)}catch(e){}
 st.sess=mtRand(10,M_ID);const pc=mtNewPc();mtStat('Conectando…');mtWaiting(st.names.g?st.names.g+' está entrando…':'Conectando…','Estabelecendo a conexão segura.');
 await pc.setLocalDescription(await pc.createOffer());await mtGather(pc);if(MT!==st||st.pc!==pc)return;await mtSend({s:st.sess,type:'offer',sdp:pc.localDescription.sdp})}
async function mtSig(d){const st=MT;if(mtGone())return;
 try{
  if(d.type=='offer'&&st.role=='g'){st.sess=d.s;const pc=mtNewPc();mtStat('Conectando…');await pc.setRemoteDescription({type:'offer',sdp:d.sdp});mtAttach();await pc.setLocalDescription(await pc.createAnswer());await mtGather(pc);if(MT!==st||st.pc!==pc)return;await mtSend({s:d.s,type:'answer',sdp:pc.localDescription.sdp})}

/* ---------- apresentação de PDF ---------- */
/* O PDF vai direto de um computador para o outro (canal criptografado da chamada), não passa pelo servidor.
   O visual é desenhado em cada lado com o pdf.js, que é baixado só na primeira vez que alguém usa. */
const PDF_MAX=40*1024*1024,PDF_CH=16*1024;let PDFJS=null;
async function mtPdfLib(){if(PDFJS)return PDFJS;const V='6.2.108';let err;
 for(const b of ['https://cdn.jsdelivr.net/npm/pdfjs-dist@'+V+'/build/','https://unpkg.com/pdfjs-dist@'+V+'/build/']){
  try{const m=await import(b+'pdf.min.mjs');m.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.mjs';PDFJS=m;return m}catch(e){err=e}}
 throw err}
function mtDcNew(pc){const st=MT;const dc=pc.createDataChannel('pres',{negotiated:true,id:1,ordered:true});dc.binaryType='arraybuffer';st.dc=dc;
 dc.onopen=()=>{if(MT!==st||st.dc!==dc)return;if(st.role=='g')mtDcTx({t:'hi',have:st.pres?st.pres.id:''});else if(st.pres&&st.pres.host)mtPdfSend()};
 dc.onmessage=e=>{if(MT===st&&st.dc===dc)mtDcRx(e.data)};
 dc.onclose=()=>{if(MT===st&&st.dc===dc)st.dc=null}}
function mtDcTx(o){const st=MT,dc=st&&st.dc;if(!dc||dc.readyState!='open')return false;try{dc.send(JSON.stringify(o));return true}catch(e){return false}}
async function mtPdfSend(){const st=MT,dc=st.dc,P=st.pres;if(!dc||dc.readyState!='open'||!P||!P.host||st.sendId===P.id)return;
 st.sendId=P.id;const ok=()=>MT===st&&st.dc===dc&&dc.readyState=='open'&&st.pres===P;
 try{dc.bufferedAmountLowThreshold=256*1024;mtDcTx({t:'pdf',id:P.id,n:P.name,sz:P.buf.byteLength});
  for(let o=0;o<P.buf.byteLength;o+=PDF_CH){
   if(!ok())throw 0;
   if(dc.bufferedAmount>1024*1024)await new Promise(r=>{const f=()=>{dc.removeEventListener('bufferedamountlow',f);r()};dc.addEventListener('bufferedamountlow',f);setTimeout(f,3000)});
   if(!ok())throw 0;dc.send(P.buf.slice(o,o+PDF_CH));
   if((o/PDF_CH)%40==0)mtPdfMsg('Enviando para o convidado… '+Math.round(o/P.buf.byteLength*100)+'%')}
  mtDcTx({t:'pdfe',id:P.id});mtDcTx({t:'pg',p:P.p});mtPdfMsg('')}
 catch(e){}
 if(st.sendId===P.id)st.sendId=null}
function mtPdfMsg(t){const e=$('#mtrx');if(!e)return;const st=MT;if(st&&st.role=='h'){const d=$('#mtpn2');if(d)d.dataset.m=t;mtPdfPg()}else{e.hidden=!t;e.textContent=t}}
function mtDcRx(d){const st=MT;if(!st)return;
 if(typeof d!='string'){const r=st.rx;if(!r)return;r.parts.push(d);r.got+=d.byteLength;if(!r.tk||r.got-r.tk>262144){r.tk=r.got;mtPdfMsg('Recebendo a apresentação… '+Math.round(r.got/Math.max(1,r.sz)*100)+'%')}return}
 let m;try{m=JSON.parse(d)}catch(e){return}
 if(st.role=='g'){
  if(m.t=='pdf'){st.rx={id:m.id,n:m.n,sz:m.sz,parts:[],got:0};st.want=m.id;mtShowDoc(true);mtPdfMsg('Recebendo a apresentação… 0%')}
  else if(m.t=='pdfe'&&st.rx&&st.rx.id==m.id){const r=st.rx;st.rx=null;const buf=new Uint8Array(r.got);let o=0;for(const p of r.parts){buf.set(new Uint8Array(p),o);o+=p.byteLength}
   mtPdfOpen(buf.buffer,r.n,m.id,false).catch(()=>{mtPdfMsg('');mtShowDoc(false);mtTip('Não foi possível abrir o PDF enviado.')})}
  else if(m.t=='pg'){st.pgWant=m.p;if(st.pres&&st.pres.id==st.want){st.pres.p=m.p;mtPdfDraw()}}
  else if(m.t=='pt'){mtLaser(m)}
  else if(m.t=='pstop'){mtPdfClear(true)}}
 else{if(m.t=='hi'&&st.pres&&st.pres.host){if(m.have==st.pres.id)mtDcTx({t:'pg',p:st.pres.p});else{st.sendId=null;mtPdfSend()}}}}
async function mtPdfOpen(buf,name,id,host){const st=MT;const lib=await mtPdfLib();const pdf=await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;if(MT!==st)return;
 if(st.pres&&st.pres.pdf&&st.pres.pdf!==pdf)try{st.pres.pdf.destroy()}catch(e){}
 st.pres={id,name,buf,pdf,pages:pdf.numPages,p:host?1:Math.min(Math.max(1,st.pgWant||1),pdf.numPages),host};
 mtPdfMsg('');mtShowDoc(true);mtPdfDraw();mtBtns()}
function mtShowDoc(on){const st=MT;if(!st)return;const d=$('#mtdoc'),sg=d&&d.parentNode;if(!d)return;d.hidden=!on;sg.classList.toggle('pres',on);
 if(on&&!st.ro&&window.ResizeObserver){st.ro=new ResizeObserver(()=>mtPdfDraw());st.ro.observe($('#mtdv'))}
 if(!on&&st.ro){st.ro.disconnect();st.ro=null}mtBtns()}
function mtPdfPg(){const st=MT,P=st&&st.pres,e=$('#mtpn2');if(!e)return;e.textContent=(P?(P.p+' / '+P.pages):'–')+(e.dataset.m?' · '+e.dataset.m:'')}
async function mtPdfDraw(){const st=MT,P=st&&st.pres;if(!P||!P.pdf)return;mtPdfPg();
 if(st.drawing){st.redraw=true;return}st.drawing=true;
 try{do{st.redraw=false;const p=P.p,pg=await P.pdf.getPage(p);if(MT!==st||st.pres!==P)break;
   const dv=$('#mtdv'),cv=$('#mtcv'),cw=$('#mtcw');if(!dv||!cv)break;const bw=Math.max(60,dv.clientWidth-24),bh=Math.max(60,dv.clientHeight-24);
   const v1=pg.getViewport({scale:1}),s=Math.min(bw/v1.width,bh/v1.height),dpr=Math.min(window.devicePixelRatio||1,2.5),vp=pg.getViewport({scale:s*dpr});
   cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);cv.style.width=Math.floor(vp.width/dpr)+'px';cv.style.height=Math.floor(vp.height/dpr)+'px';
   const task=pg.render({canvasContext:cv.getContext('2d'),viewport:vp});await task.promise;cv.dataset.p=p;cv.dataset.ok=(cv.dataset.ok|0)+1}
  while(st.redraw&&MT===st)}
 catch(e){if(!(e&&e.name=='RenderingCancelledException'))console.warn('pdf',e)}
 st.drawing=false}
function mtPdfClear(remote){const st=MT;if(!st)return;const P=st.pres;st.pres=null;st.rx=null;st.sendId=null;st.want=null;st.pgWant=0;if(P&&P.pdf)try{P.pdf.destroy()}catch(e){}
 st.laser=false;const l=$('#mtls');if(l)l.hidden=true;mtShowDoc(false);mtPdfMsg('');if(remote)mtTip('O anfitrião encerrou a apresentação.')}
function mtLaser(m){const l=$('#mtls');if(!l)return;if(!m.on){l.hidden=true;return}l.style.left=(m.x*100)+'%';l.style.top=(m.y*100)+'%';l.hidden=false}
A.mtPdf=async()=>{const st=MT;if(!st||st.role!='h')return;
 if(st.pres){mtDcTx({t:'pstop'});mtPdfClear(false);mtTip('Apresentação encerrada.');return}
 const f=$('#mtpf');if(f){f.value='';f.click()}};
async function mtPdfPick(f){const st=MT;if(!st||!f)return;
 if(!/pdf$/i.test(f.name)&&f.type!='application/pdf'){mtTip('Escolha um arquivo PDF.');return}
 if(f.size>PDF_MAX){mtTip('O PDF é grande demais (máximo 40 MB).');return}
 mtTip('Abrindo o PDF…');

async function flowRun(cid,ev,depth){depth=depth||0;if(depth>4)return false;const c=D.contents[cid];if(!c)return false;const b=c.board||'conteudo';
 const fl=flowsAll().filter(f=>f.on!==false&&f.w.b==b&&(ev=='new'?f.w.e=='new':(f.w.e=='stage'&&(!f.w.s||f.w.s==c.stage))));
 for(const f of fl){const a=f.a||{},{upd,log}=flowPlan(c,a,b,'flow');
  if(!log.length)continue;
  await W.patch('contents/'+cid,upd);await hist(cid,`Fluxo “${f.n}”: ${log.join(' · ')}`,'m');toast(`Fluxo “${f.n}” aplicado: ${log.join(', ')}.`);
  if(upd.board||upd.stage){await flowRun(cid,'stage',depth+1);return true}}
 return false}

/* ===================== CRIATIVOS · tudo num lugar só =====================
   O menu "Calendário" virou "Criativos". Dentro dele, em abas: Calendário · Produção · Validação · Agendamento.
   Fluxo: o social media planeja (calendário + ideia completa) e diz para onde vai (Design = estático, Audiovisual = vídeo) →
   vira tarefa com prazo → quem produz marca "entregue" → volta ao social para o toque final → vai ao cliente (Validação) →
   reprovou: volta para quem produziu, com o pedido · aprovou: cai sozinho em "Agendar".
   Pedidos do Tráfego/Ads seguem o mesmo caminho, mas a validação final é do gestor de tráfego (não do cliente). */
const P_hub={tab:null,f:{cl:'',who:'',ar:'',t:'',src:'',ph:'',mine:false,q:''},fim:false};
const hubAv=()=>({cal:pageOk0('calendario'),prod:pageOk0('criativos'),val:pageOk0('validacao'),pub:pageOk0('publicacoes')});
const HUBT=[['cal','Calendário','cal'],['prod','Produção','layers'],['val','Validação','shield'],['pub','Agendamento','mail']];
const hubTabs=()=>{const a=hubAv();return HUBT.filter(t=>a[t[0]])};
const PHS=[
 {id:'ideia',n:'Ideias',ic:'pen',c:'#8a96a6',w:'Social media planeja'},
 {id:'prod',n:'Em produção',ic:'film',c:'#2a78d6',w:'Design e audiovisual'},
 {id:'ajuste',n:'Ajustes',ic:'rep',c:'#d03b3b',w:'Volta para quem produziu'},
 {id:'valida',n:'Para validar',ic:'shield',c:'#eda100',w:'Toque final do social'},
 {id:'cliente',n:'Com o cliente',ic:'users',c:'#6250d6',w:'Esperando a resposta'},
 {id:'agendar',n:'Agendar',ic:'cal',c:'#0ca30c',w:'Aprovado: pronto para postar'},
 {id:'fim',n:'No ar',ic:'check',c:'#1f66f0',w:'Agendado ou publicado'}];
const phOf=i=>PHS.find(p=>p.id==i)||PHS[0];
function phaseOf(c){const b=c.board||'conteudo',st=c.stage;
 if(b=='conteudo'){
  if(['ideia','legenda'].includes(st))return 'ideia';
  if(['avaliacao','aprovado'].includes(st))return 'valida';
  if(st=='cliente')return 'cliente';
  if(st=='reprovado')return 'ajuste';
  if(st=='aprcli')return c.src=='trafego'?'fim':'agendar';
  if(st=='agendado')return 'fim';
  return 'ideia'}
 const s=stOf(b,effSt(b,st));if(s.adj)return 'ajuste';if(s.ret)return 'valida';return 'prod'}
/* rótulo da fase (pedidos do tráfego trocam "cliente" por "tráfego") */
const phName=(c,p)=>c&&c.src=='trafego'?({cliente:'Com o tráfego',fim:'Aprovado p/ anúncios',valida:'Para validar'}[p]||phOf(p).n):phOf(p).n;
const areaOf=c=>{const b=c.board||'conteudo';if(b=='design'||b=='av')return b;if(c.dept=='design'||c.dept=='av')return c.dept;return AREA_OF[c.type||'feed']||'design'};
const isVid=c=>areaOf(c)=='av';
const hubTypeOpts=sel=>['design','av'].map(a=>`<optgroup label="${a=='design'?'Design':'Audiovisual'}">${Object.entries(TYPES).filter(([k])=>AREA_OF[k]==a).map(([k,v])=>`<option value="${k}" ${sel==k?'selected':''}>${v}</option>`).join('')}</optgroup>`).join('');
const hubDue=c=>{const p=phaseOf(c);return (c.board&&c.board!='conteudo')?c.due:(p=='ideia'||p=='valida'||p=='ajuste')?(c.due||c.date):c.date};
const dueTxt=d=>{if(!d)return '';const n=Math.round((pd(d)-pd(TODAY()))/864e5);return n<0?`atrasado ${-n} dia${n==-1?'':'s'}`:n==0?'hoje':n==1?'amanhã':`em ${n} dias`};
const hubWho=c=>{const b=c.board||'conteudo';return (b=='design'?c.designer:b=='av'?c.editor:c.resp)||c.resp||c.designer||c.editor||''};
const hubOpen=c=>!['fim'].includes(phaseOf(c));
const hubStepIdx=c=>{const p=phaseOf(c);return {ideia:0,prod:1,ajuste:1,valida:2,cliente:3,agendar:4,fim:5}[p]};

function hubBase(){const f=P_hub.f,q=(f.q||'').toLowerCase();
 return Q.cts().filter(c=>(!f.cl||c.client==f.cl)&&(!f.who||[c.resp,c.designer,c.editor].includes(f.who))&&(!f.mine||[c.resp,c.designer,c.editor].includes(ME.uid))&&(!f.t||(c.type||'feed')==f.t)&&(!q||(c.title+' '+cname(c.client)).toLowerCase().includes(q)))}

  <button type="button" class="chip2 ${f.mine?'on':''}" data-a="hubMine">${ic('users')}Só minhas</button></div>`;

   Aqui: lista de conversas, chat em tempo real, painel do cliente ligado ao CRM, atendente, etiquetas e anotações. */
const P_wa={sel:null,q:'',f:'all',conv:{},msg:{},notes:{},es:[],rt:0,poll:0,tpl:null,busy:false,ok:false};

const waDig=s=>String(s||'').replace(/\D/g,'');

const waDia=t=>{const d=new Date(t),n=new Date();if(ymd(d)==ymd(n))return 'Hoje';const y=new Date(n);y.setDate(n.getDate()-1);if(ymd(d)==ymd(y))return 'Ontem';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const waOpen24=c=>c&&c.lastIn&&Date.now()-c.lastIn<24*3600*1000;

  const put=(s,v)=>{if(!s.length){Object.keys(root).forEach(k=>delete root[k]);if(v&&typeof v=='object')Object.assign(root,v);return}let o=root;for(let i=0;i<s.length-1;i++){if(!o[s[i]]||typeof o[s[i]]!='object')o[s[i]]={};o=o[s[i]]}if(v==null)delete o[s[s.length-1]];else o[s[s.length-1]]=v};
  if(patch&&m.data&&typeof m.data=='object'){for(const k in m.data)put(sg.concat(k),m.data[k])}else put(sg,m.data);waPaint()};

/* ===================== DESTINOS · ROTAS · BRIEFING =====================
   Destino = botão fixo no topo de um quadro ("Validar", "Enviar ao Design"…). Arrastar um card até ele roda uma ação
   (mover para outro funil/etapa, aparecer no Calendário, entrar na fila de Validação, passar para uma pessoa).
   Rotas = para onde vão os briefings do calendário e as respostas do cliente (aprovou/reprovou). Tudo editável em Configurações › Fluxos. */
const destsAll=()=>L((D.config&&D.config.dests)||{}).filter(d=>d&&d.n).sort((a,b)=>(a.o||0)-(b.o||0));
const rtGet=k=>{const v=((D.config&&D.config.routes)||{})[k];if(!v)return null;const [b,s]=String(v).split(':');return BOARDS[b]&&b!='crm'&&stages(b).some(x=>x.id==s)?{b,s}:null};
const whoField=b=>b=='design'?'designer':b=='av'?'editor':'resp';
/* plano de ações (compartilhado com os Fluxos): devolve o que gravar no card e o que mostrar no histórico */
function flowPlan(c,a,b,by){const upd={},log=[];
 if(a.cal&&!c.date){upd.date=addD(TODAY(),+a.cal||7);upd.calAuto=true;log.push('Calendário')}
 if(a.val&&!c.val){upd.val={t:Date.now(),from:b,by,...(a.hide?{hide:1}:{})};log.push('fila de Validação')}
 if(a.mv){const [tb,ts]=String(a.mv).split(':');if(BOARDS[tb]&&tb!='crm'&&stages(tb).some(x=>x.id==ts)&&!(tb==b&&ts==c.stage)){upd.board=tb;upd.stage=ts;
  if(tb!=b)upd.orig={b,s:c.stage};
  if(tb!='conteudo'){upd.dept=tb;if(!c.due)upd.due=(upd.date||c.date)?addD(upd.date||c.date,-3):addD(TODAY(),sysDue())}
  log.push(`${BOARDS[tb].n} › ${stOf(tb,ts).n}`)}}
 if(a.who&&D.users[a.who]&&(a.mv||log.length)){upd[whoField(upd.board||b)]=a.who;log.push('para '+uname(a.who).split(' ')[0])}
 return {upd,log}}

/* ===================== ROLAGEM LATERAL DOS QUADROS =====================
   Com o mouse bem na ponta do quadro (CRM e Criativos), aparece uma faixa; ficar com o cursor sobre ela rola o quadro para o lado.
   Assim não precisa descer até a barra do navegador. */
(function(){
 const zs={};let dir=0,raf=0,kb=null;
 const mk=side=>{const z=document.createElement('div');z.className='kbz '+side;z.setAttribute('aria-hidden','true');z.innerHTML=`<span>${side=='l'?'‹':'›'}</span>`;document.body.appendChild(z);
  return z};
 const loop=()=>{if(raf)return;const step=()=>{if(!dir||!kb||!kb.isConnected){raf=0;return}const mx=kb.scrollWidth-kb.clientWidth;kb.scrollLeft=Math.max(0,Math.min(mx,kb.scrollLeft+dir*16));
  if((dir<0&&kb.scrollLeft<=0)||(dir>0&&kb.scrollLeft>=mx-1)){dir=0;hide();raf=0;return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
 const hide=()=>{for(const s in zs)zs[s].classList.remove('on')};
 document.addEventListener('mousemove',e=>{
  if(e.buttons||dragging||document.querySelector('.md')){if(!dir)hide();return}
  const k=document.querySelector('#view .kb');if(!k||k.scrollWidth<=k.clientWidth+6){hide();dir=0;return}
  kb=k;const r=k.getBoundingClientRect(),top=Math.max(r.top,70),bot=Math.min(r.bottom,innerHeight);
  if(bot-top<80||e.clientY<top||e.clientY>bot){if(!dir)hide();return}
  if(!zs.l){zs.l=mk('l');zs.r=mk('r')}
  const canL=k.scrollLeft>2,canR=k.scrollLeft<k.scrollWidth-k.clientWidth-2,W=64;
  const nearL=canL&&e.clientX>=r.left&&e.clientX<r.left+W+10,nearR=canR&&e.clientX<=r.right+30&&e.clientX>r.right-W-10;
  zs.l.style.cssText=`top:${top}px;height:${bot-top}px;left:${Math.max(r.left,0)}px;width:${W}px`;
  zs.r.style.cssText=`top:${top}px;height:${bot-top}px;left:${Math.min(r.right,innerWidth)-W}px;width:${W}px`;
  const inL=canL&&e.clientX>=r.left&&e.clientX<r.left+W,inR=canR&&e.clientX<=r.right+30&&e.clientX>r.right-W;
  dir=inL?-1:inR?1:0;if(dir)loop();
  zs.l.classList.toggle('on',nearL||dir<0);zs.r.classList.toggle('on',nearR||dir>0)});
 document.addEventListener('mouseleave',()=>{dir=0;hide()});
 window.addEventListener('blur',()=>{dir=0;hide()});
 document.addEventListener('mousedown',()=>{dir=0;hide()},true);
})();

 $('#app').innerHTML=`<div id="pubv"><header class="phd"><span class="fl"></span><span style="font-size:.85rem;opacity:.85">Validação de conteúdo</span></header><div class="pw"><div class="intro"><h1>Olá! Confira os conteúdos de ${esc(a.name||'')}</h1><p>Veja cada publicação exatamente como ela aparecerá no Instagram e escolha <b>Aprovar</b> ou <b>Reprovar</b>. Ao reprovar, conte o que você quer mudar, por texto ou por áudio.</p><label class="fld" style="margin-top:12px">Seu nome<input id="pubn" value="${esc(nm)}" placeholder="Digite seu nome" autocomplete="name" style="border:2px solid var(--ln);border-radius:10px;padding:10px 12px"></label><div class="bar" style="margin-top:14px"><i style="width:${total?done/total*100:0}%"></i></div><p style="font-size:.82rem">${done} de ${total} avaliados</p></div><div id="pitems" style="display:grid;gap:34px">${PUB.items.map(pubItem).join('')}</div>${done==total&&total?`<div class="intro" style="text-align:center"><h1>Tudo certo! 🎉</h1><p>Recebemos suas respostas. A equipe da Owl já foi avisada.</p></div>`:''}</div></div>`;
 const n=$('#pubn');if(n)n.addEventListener('input',()=>{try{localStorage.setItem('bp_cn',n.value)}catch(e){}})}
const pubName=()=>{const v=($('#pubn')||{}).value||'';return v.trim()};
function needName(){const n=pubName();if(!n){toast('Digite seu nome no topo da página antes de avaliar.',1);const e=$('#pubn');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.focus();e.classList.add('err')}return null}return n}
async function pubSave(cid,r){const it=PUB.items.find(i=>i.id==cid);await pubApi('PUT',`approvals/${PUB.tok}/res/${cid}`,r);PUB.res[cid]=r;const resp=it.resp||PUB.a.by;await pubApi('PUT',`inbox/${resp}/${id()}`,{s:r.s,by:r.by,msg:r.msg||'',aud:r.aud||'',ti:it.title,cl:PUB.a.name||'',cid,tok:PUB.tok,t:r.t}).catch(()=>0)}
A.pubOk=async d=>{const n=needName();if(!n)return;try{await pubSave(d.i,{s:'ok',by:n,t:Date.now()});pubRender();toast('Aprovado. Obrigado!')}catch(e){toast('Não foi possível enviar. Tente de novo.',1)}};
A.pubNo=d=>{if(!needName())return;PUB.rej=d.i;REC.cid=d.i;REC.data='';const el=$('#pi-'+d.i);el.outerHTML=pubItem(PUB.items.find(i=>i.id==d.i))};

A.pubSendNo=async d=>{const n=needName();if(!n)return;const msg=($('#pm-'+d.i)||{}).value||'';if(REC.mr&&REC.mr.state=='recording'){toast('Pare a gravação antes de enviar.',1);return}
 if(!msg.trim()&&!REC.data){toast('Escreva o que deve mudar ou grave um áudio.',1);return}
 const r={s:'no',by:n,msg:msg.trim().slice(0,1500),t:Date.now()};if(REC.data&&REC.cid==d.i)r.aud=REC.data;
 try{await pubSave(d.i,r);PUB.rej=null;REC.cid=null;REC.data='';pubRender();toast('Enviado para a equipe. Obrigado!')}catch(e){toast('Não foi possível enviar. Tente de novo.',1)}};
A.recStart=async d=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});REC.mr=mr;REC.st=st;REC.cid=d.i;REC.chunks=[];REC.data='';
  mr.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(REC.timer);if(REC.discard){REC.discard=false;return}const b=new Blob(REC.chunks,{type:mr.mimeType||'audio/webm'});const fr=new FileReader();fr.onload=()=>{if(String(fr.result).length>390000){toast('O áudio ficou longo demais. Grave até 1 minuto.',1);REC.data=''}else REC.data=fr.result;const e=$('#pr-'+REC.cid);if(e)e.innerHTML=recUI(REC.cid)};fr.readAsDataURL(b)};
  mr.start();REC.t0=Date.now();const e=$('#pr-'+d.i);if(e)e.innerHTML=recUI(d.i);REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000),t=$('#rt');if(t)t.textContent=Math.floor(s/60)+':'+pad(s%60);if(s>=60)A.recStop()},500)}catch(e){toast('Não conseguimos acessar o microfone. Você pode escrever a mensagem.',1)}};
function stopRec(discard){if(REC.mr&&REC.mr.state=='recording'){REC.discard=!!discard;REC.mr.stop()}}
A.recStop=()=>stopRec(false);
A.recDel=()=>{REC.data='';const e=$('#pr-'+REC.cid);if(e)e.innerHTML=recUI(REC.cid)};
