.mk{display:inline-block;background:var(--n);-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat;aspect-ratio:1.0065}
.fl{display:inline-block;background:var(--n);-webkit-mask:var(--fl) center/contain no-repeat;mask:var(--fl) center/contain no-repeat;aspect-ratio:5.0056}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--n);background:var(--n);color:var(--y);padding:8px 16px;border-radius:10px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--nd)}
.btn:active{transform:none;box-shadow:none}
.btn.o{background:transparent;color:var(--n)}.btn.o:hover{background:#fff}
.btn.y{background:var(--y);color:var(--n);border-color:var(--y)}
.btn.d{background:transparent;color:var(--rd);border-color:var(--rd)}
.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg,.ib svg{width:18px;height:18px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{border:1px solid var(--ln);background:#fff;border-radius:9px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--n)}
.ib:hover{background:var(--n);color:var(--y)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lv{background:var(--y);display:grid;place-items:center;padding:40px;position:relative;overflow:hidden}
.lv::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(36,70,105,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(36,70,105,.09) 1px,transparent 1px);background-size:44px 44px}
.lv .in{position:relative;text-align:left;max-width:420px}
.lv .fl{width:min(100%,380px);display:block}
.lv p{font:500 1.15rem/1.5 var(--body);margin:22px 0 0;color:var(--n)}
.lr{background:var(--nd);color:var(--y);display:grid;place-items:center;padding:40px}
.lc{width:min(100%,360px);animation:up .7s var(--e) both}
.lc h1{font:800 2rem var(--display);margin:0 0 6px}
.lc p{margin:0 0 24px;opacity:.75}
.lc input{width:100%;background:#FFFEEB;color:var(--n);border:2px solid transparent;border-radius:12px;padding:13px 15px;font-size:1rem;margin-bottom:10px}
.lc input:focus{outline:0;border-color:var(--y)}
.lc .btn{width:100%;justify-content:center;margin-top:6px;background:var(--y);color:var(--n);border-color:var(--y);padding:13px}
.lc .fg{background:none;border:0;color:var(--y);opacity:.8;margin-top:14px;text-decoration:underline;padding:0}
.er{min-height:1.4em;margin-top:10px;font-weight:700;color:#ffb4b4}
/* shell */
#app{display:block}
.sb{position:fixed;left:0;top:0;bottom:0;width:68px;z-index:40;background:var(--nd);color:var(--y);overflow:hidden;padding:16px 12px;display:flex;flex-direction:column;transition:width .28s var(--e),box-shadow .28s}
.sb:hover,.sb:has(:focus-visible){width:250px;box-shadow:10px 0 34px rgba(22,48,74,.35)}
.tx{white-space:nowrap;opacity:0;transition:opacity .15s}
.sb:hover .tx,.sb:has(:focus-visible) .tx{opacity:1;transition-delay:.1s}
.sb .br{display:flex;align-items:center;gap:12px;padding:2px 0 14px;height:48px;text-decoration:none}
.sb .br .mk{width:38px;background:var(--y);flex:none}
.sb .br .fl{height:22px;background:var(--y)}
#nav{overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.ng{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;padding:14px 10px 4px;height:30px;white-space:nowrap;overflow:hidden}
.ng.tx{opacity:0}.sb:hover .ng.tx{opacity:.5}
#nav a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;padding:9px 10px;border-radius:10px;font-weight:700;white-space:nowrap;position:relative;transition:background .2s}
#nav a:hover{background:rgba(255,249,82,.1)}
#nav a.on{background:var(--y);color:var(--n)}
#nav a svg{width:20px;height:20px}
#nav a .bd{position:absolute;left:28px;top:5px;min-width:16px;height:16px;border-radius:8px;background:#ff6b6b;color:#fff;font-size:.65rem;display:grid;place-items:center;padding:0 4px}
#nav a.sub{padding-left:10px}
.sbf{border-top:1px solid rgba(255,249,82,.18);padding-top:10px;margin-top:6px}
.usr{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:inherit;padding:3px;border-radius:12px;text-align:left;white-space:nowrap;text-decoration:none}
.usr:hover{background:rgba(255,249,82,.1)}
.usr b{display:block;font-size:.9rem}.usr small{opacity:.65}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--y);color:var(--n);display:grid;place-items:center;font-weight:800;overflow:hidden;font-size:.85rem}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:22px;height:22px;font-size:.66rem}.av.l{width:84px;height:84px;font-size:1.8rem}.av.m{width:28px;height:28px;font-size:.72rem}
.sbf .usr .av{background:var(--y)}
.lo{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:inherit;opacity:.7;padding:8px 10px;white-space:nowrap}
.lo:hover{opacity:1}.lo svg{width:20px;height:20px}
.sy{display:flex;align-items:center;gap:8px;font-size:.76rem;opacity:.9;padding:6px 12px}
.sy i{width:8px;height:8px;border-radius:50%;background:#d9822b;flex:none}.sy.ok i{background:#5be08f}.sy.er i{background:#ff6b6b}
.mn{margin-left:68px;min-height:100vh;display:flex;flex-direction:column}
#view{padding:0 28px 40px;flex:1;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:22px 0 16px;flex-wrap:wrap}
.ph h1{font:800 1.85rem var(--display)}
.ph p{margin:2px 0 0;color:var(--mu)}
.ph .ac{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srch{border:2px solid var(--ln);background:#fff;border-radius:10px;padding:8px 12px;width:220px}
.srch:focus{outline:0;border-color:var(--n)}
select.flt{border:2px solid var(--ln);background:#fff;border-radius:10px;padding:7px 10px;max-width:190px}
.ts{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--n);color:var(--y);padding:12px 22px;border-radius:10px;font-weight:700;transition:transform .35s;z-index:90;max-width:80vw}
.ts.on{transform:translate(-50%,0)}.ts.er{background:var(--rd);color:#fff}
/* cards */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px;animation:up .5s var(--e) both}
.k small{display:block;color:var(--mu);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.k b{display:block;font:800 1.55rem/1.2 var(--display)}.k span{color:var(--mu);font-size:.8rem}
.k.hl{background:var(--n);color:var(--y);border-color:var(--n)}.k.hl small,.k.hl span{color:rgba(255,249,82,.75)}
.pn{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:18px 20px;animation:up .5s var(--e) both;min-width:0}
.pn h3{font-size:1.02rem;margin-bottom:2px}.pn .sub{color:var(--mu);font-size:.8rem;margin:0 0 12px}
.pn.dk{background:var(--n);color:var(--y);border-color:var(--n)}.pn.dk .sub{color:rgba(255,249,82,.7)}
.pn .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pn .hd a{font-weight:700;font-size:.8rem;color:var(--n);text-decoration:none;border-bottom:2px solid var(--y)}
.gr{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.emp{color:var(--mu);font-size:.85rem;text-align:center;padding:16px 0}
.tg{font-style:normal;font-size:.68rem;font-weight:700;background:var(--bg);border-radius:6px;padding:1px 7px;white-space:nowrap;display:inline-block}
.st{border-radius:6px;padding:2px 9px;font-size:.74rem;font-weight:700;white-space:nowrap;display:inline-block}
.st.on{background:#e3f4ea;color:var(--gn)}.st.of{background:#fde3e1;color:var(--rd)}.st.wn{background:#fff0d6;color:#8a5a00}.st.nu{background:#e9ecf1;color:var(--n2)}
/* hero */
.hero{background:var(--n);color:var(--y);border-radius:20px;padding:26px 30px;position:relative;overflow:hidden;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:20px;animation:up .5s var(--e) both}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,249,82,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,249,82,.07) 1px,transparent 1px);background-size:38px 38px}
.hero>*{position:relative}.hero h1{font:800 2rem var(--display)}.hero p{margin:4px 0 0;opacity:.8}
.hero .mk{width:84px;background:var(--y);opacity:.95}
/* lists */
.ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ul li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.ul li:hover{background:var(--bg)}.ul li b{display:block;font-size:.88rem}.ul li small{color:var(--mu)}
.ul li .r{margin-left:auto;text-align:right;white-space:nowrap;font-size:.78rem;color:var(--mu)}
.dt{display:grid;place-items:center;width:38px;height:42px;border-radius:9px;background:var(--bg);flex:none;line-height:1.1;text-align:center}
.dt b{font:800 1rem var(--display);display:block}.dt small{font-size:.6rem;text-transform:uppercase;color:var(--mu);font-weight:700}
.dt.late{background:#fde3e1}.dt.late b{color:var(--rd)}
.tb{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.tb th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:11px 14px;background:#f7f8f3;white-space:nowrap;user-select:none}
.tb th.sr{cursor:pointer}.tb th.sr:hover{color:var(--n)}
.tb td{padding:10px 14px;border-top:1px solid #eef0e8;vertical-align:middle}
.tb tr.cl{cursor:pointer}.tb tr.cl:hover td{background:#fafbf6}
.tb .ac{text-align:right;white-space:nowrap}
.tabs{display:flex;gap:4px;background:#e8eadf;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:700;color:var(--n);white-space:nowrap}
.tabs button.on{background:var(--n);color:var(--y)}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:calc(100vh - 330px)}
.kb .col{flex:0 0 272px;background:#E8EAE0;border-radius:14px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 260px);border:2px solid transparent;transition:border-color .2s,background .2s}
.kb .col.ov{border-color:var(--n);background:#dde2d2}
.col>header{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col>header i{width:9px;height:9px;border-radius:50%;flex:none}
.col>header b{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase}
.col>header em{font-style:normal;background:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:700}
.col>header span{margin-left:auto;font-size:.74rem;color:var(--mu);font-weight:700}
.col>header .add{margin-left:auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--n);background:none;font-weight:800;line-height:1;color:var(--n);flex:none}
.col>header span+.add{margin-left:6px}.col>header .add:hover{background:var(--n);color:var(--y)}
.cl2{display:grid;gap:9px;overflow-y:auto;flex:1;align-content:start;padding:2px;min-height:40px}
.cd{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(22,48,74,.12);cursor:pointer;border-left:4px solid var(--c,var(--n));transition:transform .2s var(--e),box-shadow .2s;animation:up .4s var(--e) both}
.cd[draggable=true]{cursor:grab}
.na .cd{animation:none}
.cd:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,48,74,.16)}.cd.dg{opacity:.4}
.cd .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cd h4{font:700 .93rem/1.3 var(--body);letter-spacing:0;margin:0}.cd p{margin:2px 0 0;color:var(--mu);font-size:.82rem}
.cd .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cd .mt span{background:var(--bg);border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700}
.cd .mt .vl{background:#e3f4ea;color:var(--gn)}.cd .mt .od{background:#fde3e1;color:var(--rd)}
.cd footer{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid #eef0e8;font-size:.75rem;color:var(--mu)}
.cd .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cd .ajc{margin:6px 0 0;padding:6px 8px;background:#fde3e1;color:var(--rd);border-radius:8px;font-size:.76rem;font-weight:600}
.cd .th{height:92px;border-radius:8px;background:#e8eadf center/cover;margin:-2px 0 8px;display:grid;place-items:center;color:var(--mu)}
.wa{color:var(--n);font-weight:700;text-decoration:none;border-bottom:2px solid var(--y)}.wa:hover{background:var(--y)}
.gcol{flex:0 0 180px;padding-top:2px}
.addst{width:100%;border:2px dashed var(--ln);background:none;border-radius:14px;padding:14px 10px;font-weight:700;color:var(--n)}.addst:hover{background:#fff;border-color:var(--n)}
/* modal */
.md{position:fixed;inset:0;background:rgba(22,48,74,.55);display:grid;place-items:center;padding:16px;z-index:70;animation:pop .2s both}
.md>form,.md>.bx{background:#fff;border-radius:18px;padding:24px 26px;width:min(100%,640px);max-height:92vh;overflow:auto;display:grid;gap:14px;animation:up .3s var(--e) both;align-content:start}
.md.w>form,.md.w>.bx{width:min(100%,900px)}
.md h3{font:800 1.25rem var(--display)}
.md .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg2 .w{grid-column:1/-1}.fg2 .t3{grid-column:span 1}
.md label,.fld{display:grid;gap:5px;font-weight:700;font-size:.8rem;align-content:start}
.md input,.md select,.md textarea,.fld input,.fld select,.fld textarea{border:2px solid var(--ln);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
.md input:focus,.md select:focus,.md textarea:focus{outline:0;border-color:var(--n)}
.md textarea{min-height:76px;resize:vertical}
.md input[type=checkbox]{width:auto}
.hint{color:var(--mu);font-size:.8rem;font-weight:400;margin:0}
.act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.act .d{margin-right:auto}
.err{border-color:var(--rd)!important}
.fi{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:10px;margin-top:6px}
.fi .ft{width:44px;height:44px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.66rem}
.fi b{font-size:.84rem;word-break:break-all;display:block}.fi small{color:var(--mu)}.fi a{font-weight:700;color:var(--n);font-size:.8rem}
.fi button{border:0;background:none;font-size:1.3rem;color:var(--mu)}
.fup{display:flex;border:2px dashed var(--ln);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--n);font-weight:700;justify-content:center;margin-top:6px}.fup:hover{background:var(--bg)}
.tl{display:grid;gap:0}.tl .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef0e8;font-size:.85rem}.tl .it small{color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;color:var(--n)}.chips button.on{background:var(--n);color:var(--y);border-color:var(--n)}
.bar{height:8px;border-radius:4px;background:#e8eadf;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--n);transition:width .8s var(--e)}
.sec{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:6px 0 -4px}
/* charts */
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{font:500 11px var(--body);fill:var(--mu)}
.ch .ax{stroke:#c3c2b7}.ch .gl{stroke:#e1e0d9}
.ch .hit:hover{fill:rgba(36,70,105,.06)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:95;background:#fff;border:1px solid var(--ln);box-shadow:0 8px 22px rgba(22,48,74,.18);border-radius:10px;padding:7px 11px;font-size:.78rem;pointer-events:none;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}#tip b{display:block}
.ring text.v{font:800 22px var(--display);fill:var(--tx)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.cal .h{background:#f7f8f3;padding:8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:700;text-align:center}
.cal .dy{background:#fff;min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .dy.o{background:#fafaf6}.cal .dy .n{font-size:.78rem;font-weight:700;color:var(--mu)}.cal .dy.td .n{background:var(--n);color:var(--y);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal .ev{display:flex;gap:6px;align-items:center;font-size:.72rem;font-weight:700;border-radius:7px;padding:3px 6px;cursor:pointer;background:var(--bg);border-left:3px solid var(--c,var(--n));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .ev:hover{filter:brightness(.95)}.cal .ev svg{width:12px;height:12px;flex:none}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 110px);background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.chl{border-right:1px solid var(--ln);overflow:auto;padding:10px;background:#f7f8f3}
.chl h5{margin:10px 8px 4px;font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}
.chl button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;text-align:left;font-weight:700;color:var(--n)}
.chl button:hover{background:#eceee3}.chl button.on{background:var(--n);color:var(--y)}.chl .u{margin-left:auto;background:#ff6b6b;color:#fff;font-size:.68rem;border-radius:9px;padding:0 6px}
.chm{display:flex;flex-direction:column;min-width:0}
.chm .tt{padding:12px 18px;border-bottom:1px solid var(--ln);font:800 1.05rem var(--display)}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px;background:#fcfcf8}
.mg{display:flex;gap:10px;margin-top:10px;max-width:78%}.mg.me{align-self:flex-end;flex-direction:row-reverse}
.mg .bb{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:7px 12px;white-space:pre-wrap;word-break:break-word}
.mg.me .bb{background:var(--n);color:var(--y);border-color:var(--n)}
.mg .nm{font-size:.74rem;font-weight:700;color:var(--mu);margin-bottom:2px}.mg.me .nm{text-align:right}
.mg small{color:var(--mu);font-size:.68rem;display:block;margin-top:2px}.mg.me small{text-align:right}
.mg.cli .bb{background:#fff7d6;border-color:#ecd87a;color:var(--tx)}
.dv{align-self:center;font-size:.72rem;color:var(--mu);margin:12px 0 2px;font-weight:700}
.cmp{display:flex;gap:10px;padding:12px;border-top:1px solid var(--ln)}
.cmp textarea{flex:1;border:2px solid var(--ln);border-radius:12px;padding:9px 12px;resize:none;height:42px}.cmp textarea:focus{outline:0;border-color:var(--n)}
/* approvals */
.apg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sw{width:100%;max-width:100%}
@media print{body{min-width:0;background:#fff}}
/* instagram mock */

function imgSquare(file,n){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}

/* sistema */
function cfgSistema(){const dv=drv(),p=D.config.perms||{};
 return `<div class="gr g2" style="align-items:start"><div class="pn"><h3>Anexos no Google Drive</h3><p class="sub">Arquivos anexados nos cards são enviados para a sua pasta e organizados automaticamente.</p><form id="df" class="fg2" novalidate><label class="w">Endereço do Apps Script<input name="url" value="${esc(dv.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Pasta raiz<input name="root" value="${esc(dv.root)}"></label><label>Organização<select name="mode"><option value="cd" ${dv.mode=='cd'?'selected':''}>Cliente › Setor › Conteúdo</option><option value="c" ${dv.mode=='c'?'selected':''}>Cliente › Setor</option><option value="d" ${dv.mode=='d'?'selected':''}>Setor › Cliente</option></select></label><div class="w act"><button type="button" class="btn o" data-a="drTest">Testar conexão</button><button class="btn" data-a="drSave">Salvar</button></div><div class="w hint" id="drm"></div></form></div>
 <div style="display:grid;gap:14px"><div class="pn"><h3>Permissões dos membros</h3><p class="sub">Por padrão, membros apenas visualizam, movem cards, comentam, anexam arquivos e usam o chat.</p><label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" ${p.memberEdit?'checked':''} data-c="cfgPerm"> Permitir que membros criem e editem cards, leads e conteúdos</label><p class="hint" style="margin-top:8px">Clientes, pagamentos, comissões, metas e configurações continuam exclusivos dos administradores.</p></div>
 <div class="pn"><h3>Backup</h3><p class="sub">Baixe uma cópia completa dos dados (sem as imagens de prévia).</p><button class="btn o" data-a="backup">${ic('dl')}Baixar backup (.json)</button></div>
 <div class="pn"><h3>Sobre</h3><p class="hint" style="margin:0">Blueprint · sistema interno Owl<br>Projeto Firebase: ${esc(FB.db.replace('https://','').split('.')[0])}<br>Endereço: ${esc(location.host)}</p></div></div></div>`}
A.cfgPerm=async(d,e)=>{await W.set('config/perms/memberEdit',e.target.checked);toast(e.target.checked?'Membros agora podem editar.':'Membros apenas visualizam e movem cards.')};
const drCfg=()=>{const o=form2($('#df'));o.url=o.url.trim();o.root=o.root.trim()||'Blueprint';return o};
A.drSave=async()=>{const o=drCfg(),m=$('#drm');if(o.url&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(o.url)){m.style.color='var(--rd)';m.textContent='O endereço deve começar com https://script.google.com/macros/s/ e terminar em /exec.';return}await W.set('config/drive',o);m.style.color='var(--gn)';m.textContent='Configurações salvas.'};
A.drTest=async()=>{const o=drCfg(),m=$('#drm');m.style.color='';m.textContent='Testando…';try{const t=await tok();const r=await fetch(o.url,{method:'POST',body:JSON.stringify({token:t,ping:true})});const j=await r.json();if(!j.ok)throw new Error(j.error||'ERRO');m.style.color='var(--gn)';m.textContent='Conexão com o Drive funcionando'+(j.root?' (pasta “'+j.root+'”)':'')+'.'}catch(x){m.style.color='var(--rd)';m.textContent='Não foi possível conectar ('+x.message+'). Confira a implantação do Apps Script (acesso: Qualquer pessoa) e o endereço.'}};
A.backup=async()=>{const o={_export:new Date().toISOString()};for(const k of['users','clients','contents','crm','comm','tgoals','config','approvals','meta']){o[k]=await api('GET',k).catch(()=>null)}dlFile('blueprint-backup-'+TODAY()+'.json',JSON.stringify(o,null,1),'application/json');toast('Backup baixado.')};

/* ===================== página pública de aprovação (sem login) ===================== */
let PUB=null;const REC={mr:null,st:null,chunks:[],cid:null,data:'',timer:null,t0:0};
async function pubStart(tok){
 document.body.classList.add('pub');
 const err=m=>{$('#app').innerHTML=`<div id="pubv"><header class="phd"><span class="fl"></span></header><div class="pw"><div class="intro"><h1>Link indisponível</h1><p>${esc(m)}</p></div></div></div>`};
 $('#app').innerHTML='<div id="pubv"><header class="phd"><span class="fl"></span></header><div class="pw"><div class="intro"><p>Carregando…</p></div></div></div>';
 let a;try{a=await pubApi('GET','approvals/'+tok)}catch(e){return err('Não foi possível carregar agora. Tente novamente em instantes.')}
 if(!a||a.active===false||!a.items)return err('Este link não existe ou foi desativado. Peça um novo link à equipe da Owl.');
 pubApi('PATCH','approvals/'+tok,{seen:Date.now()}).catch(()=>0);
 const items=L(a.items).sort((x,y)=>(x.date||'9')>(y.date||'9')?1:-1);
 await Promise.all(items.map(async it=>{it.imgs=[];for(const m of Object.keys(it.m||{}).sort()){try{const j=await pubApi('GET','media/'+m);if(j&&j.d)it.imgs.push(j.d)}catch(e){}}}));
 PUB={a,tok,items,res:a.res||{}};document.title='Validação de conteúdo · '+(a.name||'');pubRender()}
function pubItem(it){const r=PUB.res[it.id],a=PUB.a;
 const post=igPost({handle:a.handle||a.name,avatar:a.avatar,type:it.type,caption:it.caption,imgs:it.imgs,date:it.date,name:a.name});
 let act;
 if(r){act=`<div class="res ${r.s=='ok'?'ok':'no'}">${r.s=='ok'?'✓ Você aprovou este conteúdo':'✕ Você reprovou este conteúdo'}${r.s=='no'?`<small>${esc(r.msg||'')}${r.aud?'<br><audio controls src="'+esc(r.aud)+'" style="margin-top:6px;width:100%"></audio>':''}</small>`:''}<button class="btn o sm" data-a="pubRedo" data-c="" data-i="${it.id}" style="margin-left:auto">Alterar decisão</button></div>`}
 else if(REC.cid===it.id||PUB.rej===it.id){act=`<div class="pn" style="display:grid;gap:10px"><b>O que você gostaria de mudar?</b><textarea id="pm-${it.id}" rows="3" placeholder="Escreva aqui o que precisa ser ajustado…" style="border:2px solid var(--ln);border-radius:10px;padding:10px;width:100%;resize:vertical"></textarea><div id="pr-${it.id}">${recUI(it.id)}</div><div class="rv"><button class="btn o" data-a="pubCancel" data-i="${it.id}">Cancelar</button><button class="btn gno" data-a="pubSendNo" data-i="${it.id}">Enviar reprovação</button></div></div>`}
 else act=`<div class="rv"><button class="btn gno" data-a="pubNo" data-i="${it.id}">✕ Reprovar</button><button class="btn gok" data-a="pubOk" data-i="${it.id}">✓ Aprovar</button></div>`;
 return `<div class="pi" id="pi-${it.id}"><div class="meta"><span>${esc(it.title)}</span><span>${TYPES[it.type||'feed']}${it.date?' · publica em '+fd(it.date):''}</span></div>${post}${it.vid&&lnk(it.vid)?`<a class="btn o sm" style="justify-self:center" href="${esc(it.vid)}" target="_blank" rel="noopener">${ic('play')}Ver o vídeo</a>`:''}${act}</div>`}
function recUI(cid){if(REC.cid==cid&&REC.mr&&REC.mr.state=='recording')return `<div class="rec"><span class="dotr"></span><b id="rt">0:00</b><button class="btn sm" data-a="recStop" type="button">Parar gravação</button></div>`;
 if(REC.data&&REC.cid==cid)return `<div><audio controls src="${REC.data}" style="width:100%"></audio><button class="btn o sm" data-a="recDel" type="button">Descartar áudio</button></div>`;
 return `<button class="btn o sm" data-a="recStart" data-i="${cid}" type="button">${ic('mic')}Gravar um áudio explicando</button>`}
function pubRender(){const a=PUB.a,total=PUB.items.length,done=PUB.items.filter(i=>PUB.res[i.id]).length;let nm='';try{nm=localStorage.getItem('bp_cn')||''}catch(e){}
 $('#app').innerHTML=`<div id="pubv"><header class="phd"><span class="fl"></span><span style="font-size:.85rem;opacity:.85">Validação de conteúdo</span></header><div class="pw"><div class="intro"><h1>Olá! Confira os conteúdos de ${esc(a.name||'')}</h1><p>Veja cada publicação exatamente como ela aparecerá no Instagram e escolha <b>Aprovar</b> ou <b>Reprovar</b>. Ao reprovar, conte o que você quer mudar, por texto ou por áudio.</p><label class="fld" style="margin-top:12px">Seu nome<input id="pubn" value="${esc(nm)}" placeholder="Digite seu nome" autocomplete="name" style="border:2px solid var(--ln);border-radius:10px;padding:10px 12px"></label><div class="bar" style="margin-top:14px"><i style="width:${total?done/total*100:0}%"></i></div><p style="font-size:.82rem">${done} de ${total} avaliados</p></div><div id="pitems" style="display:grid;gap:34px">${PUB.items.map(pubItem).join('')}</div>${done==total&&total?`<div class="intro" style="text-align:center"><h1>Tudo certo! 🎉</h1><p>Recebemos suas respostas. A equipe da Owl já foi avisada.</p></div>`:''}</div></div>`;
 const n=$('#pubn');if(n)n.addEventListener('input',()=>{try{localStorage.setItem('bp_cn',n.value)}catch(e){}})}
const pubName=()=>{const v=($('#pubn')||{}).value||'';return v.trim()};
function needName(){const n=pubName();if(!n){toast('Digite seu nome no topo da página antes de avaliar.',1);const e=$('#pubn');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.focus();e.classList.add('err')}return null}return n}
async function pubSave(cid,r){const it=PUB.items.find(i=>i.id==cid);await pubApi('PUT',`approvals/${PUB.tok}/res/${cid}`,r);PUB.res[cid]=r;const resp=it.resp||PUB.a.by;await pubApi('PUT',`inbox/${resp}/${id()}`,{s:r.s,by:r.by,msg:r.msg||'',aud:r.aud||'',ti:it.title,cl:PUB.a.name||'',cid,tok:PUB.tok,t:r.t}).catch(()=>0)}
A.pubOk=async d=>{const n=needName();if(!n)return;try{await pubSave(d.i,{s:'ok',by:n,t:Date.now()});pubRender();toast('Aprovado. Obrigado!')}catch(e){toast('Não foi possível enviar. Tente de novo.',1)}};
A.pubNo=d=>{if(!needName())return;PUB.rej=d.i;REC.cid=d.i;REC.data='';const el=$('#pi-'+d.i);el.outerHTML=pubItem(PUB.items.find(i=>i.id==d.i))};
A.pubCancel=d=>{stopRec(true);PUB.rej=null;REC.cid=null;REC.data='';pubRender()};
A.pubRedo=d=>{delete PUB.res[d.i];PUB.rej=null;pubRender()};
A.pubSendNo=async d=>{const n=needName();if(!n)return;const msg=($('#pm-'+d.i)||{}).value||'';if(REC.mr&&REC.mr.state=='recording'){toast('Pare a gravação antes de enviar.',1);return}
 if(!msg.trim()&&!REC.data){toast('Escreva o que deve mudar ou grave um áudio.',1);return}
 const r={s:'no',by:n,msg:msg.trim().slice(0,1500),t:Date.now()};if(REC.data&&REC.cid==d.i)r.aud=REC.data;
 try{await pubSave(d.i,r);PUB.rej=null;REC.cid=null;REC.data='';pubRender();toast('Enviado para a equipe. Obrigado!')}catch(e){toast('Não foi possível enviar. Tente de novo.',1)}};
A.recStart=async d=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});REC.mr=mr;REC.st=st;REC.cid=d.i;REC.chunks=[];REC.data='';
  mr.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(REC.timer);if(REC.discard){REC.discard=false;return}const b=new Blob(REC.chunks,{type:mr.mimeType||'audio/webm'});const fr=new FileReader();fr.onload=()=>{if(String(fr.result).length>390000){toast('O áudio ficou longo demais. Grave até 1 minuto.',1);REC.data=''}else REC.data=fr.result;const e=$('#pr-'+REC.cid);if(e)e.innerHTML=recUI(REC.cid)};fr.readAsDataURL(b)};
  mr.start();REC.t0=Date.now();const e=$('#pr-'+d.i);if(e)e.innerHTML=recUI(d.i);REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000),t=$('#rt');if(t)t.textContent=Math.floor(s/60)+':'+pad(s%60);if(s>=60)A.recStop()},500)}catch(e){toast('Não conseguimos acessar o microfone. Você pode escrever a mensagem.',1)}};
function stopRec(discard){if(REC.mr&&REC.mr.state=='recording'){REC.discard=!!discard;REC.mr.stop()}}
A.recStop=()=>stopRec(false);
A.recDel=()=>{REC.data='';const e=$('#pr-'+REC.cid);if(e)e.innerHTML=recUI(REC.cid)};

(async function init(){
 try{const r=sessionStorage.getItem('bp_redirect');if(r){sessionStorage.removeItem('bp_redirect');history.replaceState({},'',r)}}catch(e){}
 const p=path();
 if(/^aprovar\/[\w-]{8,}/.test(p))return pubStart(p.split('/')[1]);
 let rt=null;try{rt=localStorage.getItem('bp_rt')}catch(e){}
 if(rt){S.rt=rt;try{await refreshTok();const lk=await idt('lookup',{idToken:S.tok});S.email=lk.users&&lk.users[0]&&lk.users[0].email;return boot()}catch(e){try{localStorage.removeItem('bp_rt')}catch(z){}}}
 loginView();
})();


</script></body></html>
